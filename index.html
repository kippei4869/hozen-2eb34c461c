<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>機械保全1級 学科トレーナー</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="">
<meta name="theme-color" content="#e9edef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="機械保全1級">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --paper:#e9edef; --card:#ffffff; --ink:#16212b; --sub:#5b6772;
  --rule:#c7d1d8; --rule2:#e3e9ec;
  --mark:#f2c200; --markdark:#8a6d00;
  --ok:#0d6f52; --okbg:#e6f3ee; --ng:#a5302a; --ngbg:#faeae9;
  --focus:#1d5c8f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP","Meiryo",sans-serif;
  font-size:16px; line-height:1.75; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:680px;margin:0 auto;padding:0 14px 96px}
.num{font-variant-numeric:tabular-nums}

/* ---- header ---- */
header{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.hd{max-width:680px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px;min-height:52px}
.hd h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.04em;flex:1}
.hd .pos{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--rule2)}
.bar>i{display:block;height:100%;background:var(--mark);width:0;transition:width .25s ease}
.iconbtn{border:1px solid var(--rule);background:var(--card);color:var(--ink);
  border-radius:6px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.iconbtn:active{background:var(--rule2)}

/* ---- generic ---- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px;margin:14px 0}
h2{font-size:16px;margin:26px 0 10px;font-weight:700;letter-spacing:.03em}
h2:first-child{margin-top:18px}
.hint{font-size:13px;color:var(--sub);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:999px;
  padding:9px 15px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);min-height:42px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,.iconbtn:focus-visible,.opt:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:block;width:100%;border:1px solid var(--ink);background:var(--card);color:var(--ink);
  border-radius:10px;padding:16px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.btn.primary{background:var(--mark);border-color:#d9b000}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn small{display:block;font-weight:400;font-size:13px;color:var(--sub);margin-top:2px}
.btn.primary small{color:#6b5600}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}

/* ---- question ---- */
.qmeta{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--sub);margin-bottom:8px}
.qtag{border:1px solid var(--rule);border-radius:4px;padding:1px 7px;font-size:12px}
.qtext{font-size:17px;line-height:1.9;white-space:pre-wrap;margin:4px 0 14px}
.fig{margin:0 0 16px;text-align:center;background:#fff;border:1px solid var(--rule2);border-radius:8px;padding:10px}
.fig img{max-width:100%;height:auto;display:block;margin:0 auto}
.oxrow{display:flex;gap:12px}
.ox{flex:1;border:2px solid var(--ink);background:var(--card);border-radius:12px;
  padding:18px 8px;font:inherit;font-size:34px;line-height:1.1;cursor:pointer;color:var(--ink)}
.ox span{display:block;font-size:13px;font-weight:400;color:var(--sub);margin-top:6px}
.opt{display:flex;gap:12px;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);
  border-radius:10px;padding:14px;font:inherit;font-size:15.5px;line-height:1.7;cursor:pointer;color:var(--ink);margin-bottom:10px}
.opt b{flex:0 0 30px;height:30px;border:1px solid var(--ink);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:14px}
.opt:active,.ox:active{background:var(--rule2)}
.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick .opt.sel b,.pick .ox.sel{background:var(--ink);color:#fff}
.opt.good,.ox.good{border-color:var(--ok);background:var(--okbg)}
.opt.good b{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.bad,.ox.bad{border-color:var(--ng);background:var(--ngbg)}
.opt.bad b{border-color:var(--ng);background:var(--ng);color:#fff}

/* ---- judgement ---- */
.judge{border-radius:10px;padding:14px 16px;margin:16px 0 0;border:1px solid}
.judge.o{border-color:var(--ok);background:var(--okbg)}
.judge.x{border-color:var(--ng);background:var(--ngbg)}
.judge .t{font-weight:700;font-size:16px;margin-bottom:2px}
.judge.o .t{color:var(--ok)} .judge.x .t{color:var(--ng)}
.exp{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule2);font-size:15px;line-height:1.9}
.exp .lb{font-size:12px;color:var(--sub);display:block;margin-bottom:2px}

/* ---- sticky footer ---- */
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(233,237,239,.96);
  border-top:1px solid var(--rule);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:15;
  backdrop-filter:saturate(1.2) blur(6px)}
.foot .inner{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}
.foot .btn{margin-top:0}
.tally{font-size:13px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---- grid nav ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px}
.gi{border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:9px 0;
  font:inherit;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--ink)}
.gi.done{background:var(--ink);color:#fff;border-color:var(--ink)}
.gi.now{outline:2px solid var(--mark);outline-offset:1px}
.gi.o{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.gi.x{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}

/* ---- result ---- */
.score{text-align:center;padding:22px 10px 18px}
.score .big{font-size:58px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .unit{font-size:20px;font-weight:400}
.score .st{display:inline-block;margin-top:12px;padding:5px 16px;border-radius:999px;font-size:14px;font-weight:700}
.st.pass{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.st.fail{background:var(--ngbg);color:var(--ng);border:1px solid var(--ng)}
.metrics{display:flex;justify-content:center;gap:26px;margin-top:14px;font-size:13px;color:var(--sub)}
.metrics b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.catrow{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13.5px}
.catrow .nm{flex:0 0 118px}
.catrow .tr{flex:1;height:9px;background:var(--rule2);border-radius:5px;overflow:hidden}
.catrow .tr>i{display:block;height:100%;background:var(--ink)}
.catrow .vl{flex:0 0 52px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
details.rv{border:1px solid var(--rule);background:var(--card);border-radius:8px;margin-bottom:8px}
details.rv>summary{padding:12px 14px;cursor:pointer;font-size:14.5px;list-style:none;display:flex;gap:10px}
details.rv>summary::-webkit-details-marker{display:none}
details.rv>summary .k{flex:0 0 auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
details.rv .bd{padding:0 14px 14px;border-top:1px solid var(--rule2);margin-top:2px;padding-top:12px}
.miss{color:var(--ng);font-weight:700}
.note{font-size:13px;color:var(--sub);border-left:3px solid var(--rule);padding-left:10px;margin:10px 0}
.count{font-size:13px;color:var(--sub);margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1 id="ttl">機械保全技能士1級 学科</h1>
    <span class="pos num" id="pos"></span>
    <button class="iconbtn" id="quit" hidden>中断</button>
  </div>
  <div class="bar"><i id="prog"></i></div>
</header>
<main class="wrap" id="app"></main>
<div class="foot" id="foot" hidden><div class="inner" id="footin"></div></div>

<script>
const DATA = [{"y":2020,"n":1,"t":"ox","cat":"工作機械・FA","q":"形削り盤は、刃物を直線往復運動させて、平面削りや溝加工を行う工作機械である。","a":"○","e":"形削り盤（シェーパ）はバイトを直線往復運動させ、平面削りや溝加工を行う工作機械。記述のとおり。"},{"y":2020,"n":2,"t":"ox","cat":"工作機械・FA","q":"直立ボール盤における振りとは、取り付けることができる工作物の最大直径のことである。","a":"○","e":"「振り」は主軸中心からコラム（支柱）までの距離の2倍で、取り付けられる工作物の最大直径を表す。"},{"y":2020,"n":3,"t":"ox","cat":"工作機械・FA","q":"生産システムとそれらを構成する機器において、オートローダとは、加工、組立などに供する部品を整列して所定の場所まで自動的に送り出す装置のことである。","a":"×","e":"この説明はパーツフィーダのもの。オートローダは工作機械などに工作物を自動的に取付け・取外しする装置。"},{"y":2020,"n":4,"t":"ox","cat":"電気・電子","q":"皮相電力とは、交流回路において、負荷に電圧Vを加えて電流Iが流れているときの、みかけ上の電力VIのことである。","a":"○","e":"皮相電力＝VI〔VA〕。有効電力＝VIcosθ〔W〕、無効電力＝VIsinθ〔var〕。"},{"y":2020,"n":5,"t":"ox","cat":"電気・電子","q":"電気機械器具の外郭による保護等級（IPコード）のIP67の6とは、耐塵構造を表している。","a":"○","e":"第1特性数字は固形物に対する保護等級で、6は粉じんの侵入がない耐じん形。第2特性数字7は一時的な水没に対する保護。"},{"y":2020,"n":6,"t":"ox","cat":"電気・電子","q":"三相誘導電動機の極数が4極、電源周波数が50Hz、すべり2％の場合の回転数は、1,470min⁻¹である。","a":"○","e":"同期速度Ns＝120f/p＝120×50/4＝1,500min⁻¹。回転数N＝Ns(1−s)＝1,500×0.98＝1,470min⁻¹。"},{"y":2020,"n":7,"t":"ox","cat":"保全管理","q":"ある設備において、負荷時間100時間のうち、故障停止が3回でその合計時間は7時間であった。このときの故障度数率は、7％である。","a":"×","e":"故障度数率＝故障停止回数÷負荷時間×100＝3÷100×100＝3％。7％になるのは故障強度率（7h÷100h）。"},{"y":2020,"n":8,"t":"ox","cat":"保全管理","q":"偶発故障期間とは、初期の設計・製造工程でのミスや、不良部品の使用などによる故障発生期間のことをいう。","a":"×","e":"この説明は初期故障期間。偶発故障期間は故障が偶発的に起こり、故障率がほぼ一定になる安定した期間。"},{"y":2020,"n":9,"t":"ox","cat":"保全管理","q":"故障解析の手法として、FTAを適用する場合、下位から上位の故障モードへ解析を進めていく。","a":"×","e":"FTAは頂上事象（上位）から原因（下位）へ展開するトップダウン手法。下位から上位へ積み上げるのはFMEA。"},{"y":2020,"n":10,"t":"ox","cat":"保全管理","q":"性能稼働率は、速度稼働率と正味稼働率の積で表される。","a":"○","e":"性能稼働率＝速度稼働率×正味稼働率。設備総合効率＝時間稼働率×性能稼働率×良品率。"},{"y":2020,"n":11,"t":"ox","cat":"保全管理","q":"JISにおいて、MTBFとは、非修理系アイテムでは平均故障寿命のことである。","a":"×","e":"MTBF（平均故障間動作時間）は修理しながら使うアイテムの指標。非修理系アイテムの平均故障寿命はMTTF。"},{"y":2020,"n":12,"t":"ox","cat":"測定機器","q":"ニッケルを用いた抵抗温度計は、K型熱電温度計に比べて、高温まで測定可能である。","a":"×","e":"ニッケル測温抵抗体の使用範囲はおよそ−50〜300℃。K型熱電対は1,000℃を超える高温まで測定でき、熱電対の方が高温向き。"},{"y":2020,"n":13,"t":"ox","cat":"潤滑","q":"アブレシブ摩耗の対策の1つとして、防塵性の向上が挙げられる。","a":"○","e":"アブレシブ摩耗は硬い異物や突起による引っかき摩耗。異物の侵入を防ぐ防塵性向上・油の清浄化が有効。"},{"y":2020,"n":14,"t":"ox","cat":"機械要素","q":"転がり軸受の振動や軸の変位を小さくするため、呼び番号6220の軸受を6220C2に変更した。","a":"○","e":"C2は標準（CN）より小さいラジアル内部すきま。すきまを小さくすると振れや変位を抑えられる。"},{"y":2020,"n":15,"t":"ox","cat":"振動・破面解析","q":"手持ち式振動ピックアップを用いて測定する際、測定面が曲面の場合は、平らな面を作りピックアップを密着させる必要がある。","a":"○","e":"曲面のままでは接触が不安定になり、特に高周波成分が正しく測れない。平面を作り密着させるのが正しい。"},{"y":2020,"n":16,"t":"ox","cat":"品質管理","q":"ある製品の重量を測定した結果、7g、9g、10g、11g、13gの5個のデータが得られた。これらの製品の標準偏差は3gである。","a":"×","e":"平均10g、偏差は−3,−1,0,+1,+3。二乗和20をデータ数5で割ると4、その平方根で標準偏差は2g。"},{"y":2020,"n":17,"t":"ox","cat":"品質管理","q":"p管理図を用いる例として、アルミ板表面の単位面積あたりのへこみ傷の数の管理が挙げられる。","a":"×","e":"単位あたりの欠点数を管理するのはu管理図。p管理図は不適合品率（不良率）を管理する計数値管理図。"},{"y":2020,"n":18,"t":"ox","cat":"品質管理","q":"抜取検査において、OC曲線とは、ロットの不良率と検査合格率との関係を示す曲線である。","a":"○","e":"OC曲線（検査特性曲線）は横軸にロットの不良率、縦軸に合格確率をとった曲線。生産者危険・消費者危険もこの曲線で表される。"},{"y":2020,"n":19,"t":"ox","cat":"機械材料","q":"ステンレス鋼は、軟鋼よりも熱伝導率が高い。","a":"×","e":"ステンレス鋼の熱伝導率は軟鋼のおよそ1/3程度と低い。溶接時にひずみが出やすい理由の1つ。"},{"y":2020,"n":20,"t":"ox","cat":"機械材料","q":"青銅は、主成分がCuとZnの合金である。","a":"×","e":"青銅はCu（銅）とSn（すず）の合金。CuとZn（亜鉛）の合金は黄銅（真ちゅう）。"},{"y":2020,"n":21,"t":"ox","cat":"機械材料","q":"鋼の内部応力を低減するため、低温焼なましを行った。","a":"○","e":"低温焼なまし（応力除去焼なまし）は、変態点以下で加熱・徐冷して残留応力を除去する熱処理。"},{"y":2020,"n":22,"t":"ox","cat":"安全衛生","q":"フェイルセーフ設計の例として、回転物への巻き込まれ防止のカバーが挙げられる。","a":"×","e":"カバーは危険源を隔離するガード（フールプルーフ的な対策）。フェイルセーフは故障・異常時に安全側へ働く設計（例：停電時にブレーキがかかる）。"},{"y":2020,"n":23,"t":"ox","cat":"安全衛生","q":"C火災を消火する方法の1つとして、強化液消火薬剤を棒状放射することが挙げられる。","a":"×","e":"C火災は電気火災。導電性のある薬剤を棒状放射すると感電のおそれがある。強化液は霧状放射なら電気火災に適用できる。"},{"y":2020,"n":24,"t":"ox","cat":"安全衛生","q":"酸素欠乏症等防止規則において、作業開始前に作業場の空気中の酸素の濃度を測定した際は、その都度測定日時や測定方法などの7つの事項を記録し、これを3年間保存しなければならないと定められている。","a":"○","e":"酸欠則第3条により、測定日時・方法・箇所・結果・実施者名など7項目を記録し3年間保存する。"},{"y":2020,"n":25,"t":"ox","cat":"安全衛生","q":"労働安全衛生法において、動力により駆動されるプレス機械を3台以上有する事業所では、プレス機械作業主任者を選任しなければならないと定められている。","a":"×","e":"プレス機械作業主任者の選任が必要なのは動力プレス5台以上の事業場。"},{"y":2020,"n":26,"t":"mc","cat":"機械要素","q":"機械の主要構成要素に関する記述のうち、適切なものはどれか。","a":"ア","e":"メカニカルシールは軸に直角な端面どうしで密封するため、軸表面をしめつけるグランドパッキンより摺動面の摩擦抵抗・漏れが小さい。イ：JISの呼び番号で両側シール形はUU（シールド形はZZ）などで表す。ウ：固定軸継手は軸心のずれを許容できず、許容範囲はオルダム軸継手より小さい。エ：ベルトの内側にテンションプーリを置くと逆曲げにならない。逆曲げによる亀裂が問題になるのは外側に設置した場合。","ch":["メカニカルシールは、グランドパッキンと比べ、摺動面の摩擦抵抗が小さい。","転がり軸受の呼び番号でSSの表記があるものは、軸受にグリースを封入し、両側をシールしたタイプである。","固定軸継手は、オルダム軸継手と比べ、アライメントの許容範囲が大きい。","Vベルト駆動装置において、Vベルトの内側にテンションプーリを設置する場合は、接触角度が増し、亀裂が発生しやすくなる。"]},{"y":2020,"n":27,"t":"mc","cat":"機械要素","q":"ボールねじに関する記述のうち、適切でないものはどれか。","a":"イ","e":"ボールねじは転がり接触のため機械効率は90％以上（一般に90〜95％）。20〜30％程度なのは滑り接触の三角ねじなど。","ch":["寿命時間が計算できるので、使用可能期間を予測することができる。","機械効率は、20〜30％である。","予圧を与えることにより、バックラッシを低減し、剛性を高めることができる。","静摩擦係数と動摩擦係数の差が小さく、スティックスリップを生じにくい。"]},{"y":2020,"n":28,"t":"mc","cat":"機械要素","q":"歯車に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"やまば歯車（ダブルヘリカルギヤ）は、ねじれ方向が逆の2組のはすば歯車を組み合わせた形で、軸方向力（スラスト）が互いに打ち消され発生しない。","ch":["はすば歯車は、2軸の相対位置が平行な場合に用いられる。","まがりばかさ歯車は、高負荷・高速運転に適するため、自動車や船舶の最終減速装置などに用いられる。","やまば歯車は、軸方向の力が発生する。","内歯車は、円筒の内側に歯を刻んだもので、かみ合う外歯車との回転方向は同一である。"]},{"y":2020,"n":29,"t":"mc","cat":"測定機器","q":"回路計（テスタ）の使用方法に関する記述のうち、適切なものはどれか。","a":"ア","e":"テスタは応答が遅く、短時間で変動するデジタル（パルス）信号の測定には向かず、オシロスコープを用いる。イ：指で触れると人体の抵抗が加わり誤差になる。ウ：レンジ切換はプローブを回路から外してから行う。エ：測定値が予測できないときは大きいレンジから始める。","ch":["デジタル信号は、短時間に電圧が変動するため測定に適さない。","抵抗値を測定する際は、2本のプローブの両端共、指で触れながら行う。","測定レンジは、プローブを測定回路に接続して切り換える。","測定レンジの小さい方から測定するのが望ましい。"]},{"y":2020,"n":30,"t":"mc","cat":"測定機器","q":"機械の点検に使用する測定器具に関する記述のうち、適切でないものはどれか。","a":"ア","e":"白金測温抵抗体（およそ−200〜660℃）の方がニッケル（およそ−50〜300℃）より測定温度範囲が広い。","ch":["ニッケルを用いた抵抗温度計は、白金を用いた抵抗温度計よりも測定温度範囲が広い。","ブルドン管圧力計は、正の圧力測定のほかに、負の圧力測定もできる。","電磁流量計は、測定する流体の圧力や粘度の影響を受けない。","ダイヤルゲージの長針は、プランジャ（スピンドル）を押し込むときに右回りに動く。"]},{"y":2020,"n":31,"t":"mc","cat":"振動・破面解析","q":"オイルホワールに関する記述のうち、適切なものはどれか。","a":"ウ","e":"オイルホワールは滑り軸受の油膜による自励振動で、発生周波数は回転周波数の約1/2（0.42〜0.48倍）、振回り方向は軸の回転方向と同じ。イとエはオイルホイップの説明。","ch":["振回りの方向は、軸の回転方向と逆である。","発生する周波数は、回転軸の一次危険速度の周波数と一致する。","発生する周波数は、回転周波数の約1/2である。","軸の回転数が、回転軸の一次危険速度の2倍以上となったときに発生する。"]},{"y":2020,"n":32,"t":"mc","cat":"振動・破面解析","q":"疲労破壊に関する記述のうち、適切でないものはどれか。","a":"ア","e":"疲労限度は切欠き・段付き・表面粗さなどによる応力集中の影響を強く受ける。材質が同じでも形状が変われば値は変わる。","ch":["疲労限度は、材質が同じならば形状にかかわらず同じ値である。","ストライエーションとは、疲労破壊した破断面に観察される縞模様である。","変動する応力が弾性限度以下でも発生する。","繰り返し荷重などによって発生する。"]},{"y":2020,"n":33,"t":"mc","cat":"機械要素","q":"機械要素の異常における対応処置に関する記述のうち、適切でないものはどれか。","a":"イ","e":"フレッチングコロージョンははめあい面の微小な繰返しすべりが原因。面粗度は小さく（滑らかに）し、しめしろを大きくするなどの対策をとる。粗くすると悪化する。","ch":["歯車にピッチングが発生したので、歯当たりの確認および修正を行った。","転がり軸受のはめあい部にフレッチングコロージョンが発生したので、外輪のはめあい部の面粗度を大きいものに変更した。","高温環境下での使用により、ニトリルブタジエンゴム製シールが変形したので、ふっ素ゴム製シールに変更した。","滑り軸受を用いた主軸にオイルホイップが発生したので、軸受幅を小さくした。"]},{"y":2020,"n":34,"t":"mc","cat":"潤滑","q":"潤滑方式の1つである噴霧給油の特徴として、適切でないものはどれか。","a":"イ","e":"噴霧給油（オイルミスト潤滑）は圧縮空気とともに霧状の油を送るため冷却作用があり、油温は上昇しにくい。","ch":["軸受箱内のオイルミストの内圧が保持される。","油温が上昇しやすい。","消費量と同量の油が供給される。","常に新しい油が供給される。"]},{"y":2020,"n":35,"t":"mc","cat":"潤滑","q":"潤滑に関する記述のうち、適切なものはどれか。","a":"ア","e":"油浴潤滑の適正油面は最下位の転動体の中心付近。高すぎるとかくはん抵抗と発熱が増すので下げるのは適切。イ：給油口は非負荷側のすきまの広い部分に設ける。ウ：導電性のある水－グリコール系作動油に静電浄化法は使えない。エ：重荷重には極圧剤入りのグリースが必要。","ch":["油浴潤滑式の減速機を点検したところ、油面が横軸支持の深溝玉軸受の最低位置にある転動体の中心より高かったため、油面を下げた。","滑り軸受の給油口を、負荷側の軸受内すきまの狭いところに設置した。","水－グリコール系の油を浄油するために、静電浄化法を実施した。","重荷重を受けている軸受を点検したところ、フレーキングを発見したため、軸受のグリースを、極圧剤を配合したリチウムグリースから、極圧剤を配合していないシリコングリースへ変更した。"]},{"y":2020,"n":36,"t":"mc","cat":"潤滑","q":"JISにおいて、潤滑油の試験項目に関する記述のうち、適切でないものはどれか。","a":"エ","e":"動粘度は、粘度をその液体の同一状態（温度・圧力）における密度で除した商。異なる温度での粘度の比ではない。","ch":["酸価とは、試料1g中に含まれる酸性成分を中和するのに要する水酸化カリウムのmg数のことである。","流動点とは、試料を45℃に加熱した後、かき混ぜないで規定の方法で冷却したとき、試料が流動する最低温度のことである。","引火点とは、規定条件下で引火源を試料蒸気に近づけたとき、試料蒸気が閃光を発して瞬間的に燃焼し、かつその炎が液面上を伝播する試料の最低温度を101.3kPaの値に気圧補正した温度のことである。","動粘度とは、同一圧力において、その液体が0℃のときの粘度と、20℃のときの粘度の比のことである。"]},{"y":2020,"n":37,"t":"mc","cat":"溶接・非破壊検査","q":"溶接に関する記述のうち、適切でないものはどれか。","a":"イ","e":"アークの保持が難しく溶込み不良になるのは溶接電流が小さすぎるとき。電流が大きすぎるとアンダカットやスパッタが増える。","ch":["ガス溶接は、温度調整によりひずみを少なく仕上げることができる。","被覆アーク溶接において、溶接電流が大きいとアークの保持が困難となり溶込み不良を生じる。","チタン材料の溶接は、アルゴンなどの不活性ガス雰囲気または高真空中で行う。","スポット溶接やシーム溶接などの電気抵抗溶接は、圧接に分類される。"]},{"y":2020,"n":38,"t":"mc","cat":"機械工作法","q":"機械工作法に関する記述のうち、適切でないものはどれか。","a":"イ","e":"通電して表面の突起を溶解するのは電解研磨。化学研磨は通電せず、薬品中に浸して化学的に表面を溶解・平滑化する。","ch":["電子ビーム加工は、ステンレス鋼や銅などの溶接が可能である。","化学研磨とは、被加工物に電流を流し、表面の突起部分を溶解する方法である。","ラッピング加工には、乾式ラッピングと湿式ラッピングがある。","きさげ作業は、工作機械などの摺動面の仕上げとして行う。"]},{"y":2020,"n":39,"t":"mc","cat":"溶接・非破壊検査","q":"ブローホール、溶込不良、融合不良などの溶接線の内部欠陥を検出できる非破壊試験の方法として、もっとも適切なものはどれか。","a":"ア","e":"内部欠陥の検出には放射線透過試験（RT）や超音波探傷試験（UT）を用いる。磁粉・浸透・渦流は表面または表面近傍の欠陥用。","ch":["放射線透過試験法","渦流探傷試験法","磁粉探傷試験法","浸透探傷試験法"]},{"y":2020,"n":40,"t":"mc","cat":"油圧・空気圧","q":"空気圧機器に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"ルブリケータに使う潤滑油はタービン油（ISO VG32程度）が適している。","ch":["空油変換器を使用することで、シリンダの低速での動作を安定させることができる。","自動可変式ルブリケータには、空気の流れが少ないときも潤滑油の供給量が一定になるよう可変絞り機構が設けられている。","ルブリケータに使用する潤滑油は、スピンドル油が適している。","空気圧モータには、一方向回転形と正逆回転形がある。"]},{"y":2020,"n":41,"t":"mc","cat":"油圧・空気圧","q":"油圧機器に関する記述のうち、適切なものはどれか。","a":"イ","e":"直流ソレノイドはプランジャ位置によらず電流がほぼ一定で、吸引しきれなくても焼損しにくい。交流はプランジャが動かないと大電流が流れ焼損しやすい。ア：許容ドレン圧力は0.03MPa程度。ウ：背圧がかかると二次側圧力は上昇する。エ：封入ガスは窒素。","ch":["油圧モータのオイルシールは、一般的に、ドレン圧力が0.3MPa程度までならば使用できる。","直流ソレノイドは、交流ソレノイドと比較してソレノイドコイルの焼損が発生しにくい。","減圧弁のドレンポートに必要以上の背圧がかかると、二次側の圧力は低下する。","アキュムレータに封入するガスは、酸素を使用する。"]},{"y":2020,"n":42,"t":"mc","cat":"油圧・空気圧","q":"油圧装置および空気圧装置の異常時における対応に関する記述のうち、適切なものはどれか。","a":"ウ","e":"シリンダ速度は流量で決まるため、速度低下にはポンプの容積効率低下や圧力上昇不良への対策が有効。ア：排気ポートからの漏れはピストンパッキンの不良を疑う。イ：オーバライドを大きくしてもチャタリング対策にならない。エ：ゴムホースは適度なたるみをもたせて取り付ける。","ch":["方向制御弁の排気ポート側から空気漏れがあったので、空気圧シリンダのロッドパッキンを点検した。","パイロット作動形リリーフ弁にチャタリングが発生したので、オーバーライドを大きくした。","油圧シリンダの速度が低下したので、油圧ポンプの容積効率の向上や圧力上昇不良対策を行った。","油圧装置において直線的に使用していたゴムホースが破損したので、新しいゴムホースをたるみがないよう張って取り付けた。"]},{"y":2020,"n":43,"t":"mc","cat":"油圧・空気圧","q":"難燃性作動油に関する記述のうち、適切でないものはどれか。","a":"イ","e":"O/W型（水中油滴形）は水が主体で燃えにくく、消防法の危険物には該当しない。","ch":["W/O型エマルジョン系作動油は、難燃性を必要とする場合に使用される。","O/W型エマルジョン系作動油は、消防法において危険物に該当する。","O/W型エマルジョン系作動油は、切削油や研削油などに使用される。","水・グリコール系作動油は、圧力が約20MPaクラスの油圧機器などに使用される。"]},{"y":2020,"n":44,"t":"mc","cat":"機械材料","q":"非金属材料に関する記述のうち、適切でないものはどれか。","a":"ア","e":"ゴムは吸水すると電気絶縁性が低下する。","ch":["ゴムの電気絶縁特性は、吸水量が増えると上昇する。","ゴムの温度は、変形が頻繁に繰り返されると上昇する。","ふっ素ゴムは、合成ゴムの一種である。","導電性ゴムは、帯電を防止する効果がある。"]},{"y":2020,"n":45,"t":"mc","cat":"機械材料","q":"金属材料の表面処理に関する文中の（　）内に当てはまる語句として、適切なものはどれか。\n「金属材料にクロムめっきを施すと、めっき層に存在する（　）の影響で、強度が低下することがある。」","a":"イ","e":"電気めっきの際に発生した水素がめっき層や素地に取り込まれ、水素ぜい性によって強度が低下することがある。対策としてベーキング（脱水素処理）を行う。","ch":["窒素","水素","炭素","塩素"]},{"y":2020,"n":46,"t":"mc","cat":"機械材料","q":"金属材料の表面処理法に関する記述のうち、適切なものはどれか。","a":"ウ","e":"ショットピーニングは小球を高速で打ち付けて表面を加工硬化させ、圧縮残留応力を与えて疲労強度を高める。ア：浸炭は低炭素鋼に用いる。イ：亜鉛めっきは犠牲防食により鉄鋼の錆止めに適する。エ：浸漬するのは溶融めっき。溶射は溶融材料を吹き付ける。","ch":["浸炭処理は、低炭素鋼には適していない。","亜鉛めっきは、大気中の鉄鋼の錆止めには適していない。","ショットピーニングは、圧縮空気または遠心力によってショットを母材に噴射し激突させる表面硬化法である。","溶射は、金属や合金または金属の酸化物などを溶融状態にし、これに基材を浸漬して皮膜を作る表面処理法である。"]},{"y":2020,"n":47,"t":"mc","cat":"材料力学","q":"下図において、継手にかかる荷重Pが6,280N、継手を繋ぐピンに発生するせん断応力が10N/mm²のとき、ピンの直径dとしてもっとも近いものはどれか。","a":"イ","e":"両側で支える二面せん断。必要断面積A＝6,280÷(2×10)＝314mm²。πd²/4＝314よりd²≒400、d＝20mm。","ch":["10mm","20mm","30mm","40mm"],"fig":"2020_q47"},{"y":2020,"n":48,"t":"mc","cat":"材料力学","q":"下図の応力－ひずみ線図に関する記述のうち、適切でないものはどれか。","a":"ア","e":"図のA点が比例限度、B点が弾性限度、C点が上降伏点、D点が下降伏点。弾性変形から塑性変形に移行する降伏点はC点であり、B点は弾性限度。","ch":["B点を降伏点といい、弾性変形から塑性変形に移行する点である。","線①を公称応力－ひずみ図といい、線②を真応力－ひずみ図という。","E点を引張強さといい、F点を破断点という。","D点を下降伏点といい、応力が増加せずひずみが急に増加しはじめる点である。"],"fig":"2020_q48"},{"y":2020,"n":49,"t":"mc","cat":"製図","q":"はめあいに関する記述のうち、適切でないものはどれか。","a":"イ","e":"一般には穴基準はめあいが用いられ、加工が難しい穴を基準として軸を仕上げる。軸基準は特別な場合に限られる。","ch":["中間ばめは、穴の最小許容寸法に対して軸の最大許容寸法が等しいか、大きい場合、または穴の最大許容寸法に対して軸の最小許容寸法が等しいか、小さい場合のはめあいである。","複数の穴と軸のはめあいを加工する場合、一般的に軸の寸法を基準として穴を加工する。","すきまばめは、穴の最小許容寸法に対して軸の最大許容寸法が等しいか、小さい場合のはめあいである。","しまりばめは、穴の最大許容寸法に対して軸の最小許容寸法が等しいか、大きい場合のはめあいである。"]},{"y":2020,"n":50,"t":"mc","cat":"機械材料","q":"JISにおいて、材料記号と規格名称の組合せとして、適切でないものはどれか。","a":"エ","e":"SSは一般構造用圧延鋼材（例：SS400）。炭素鋼鍛鋼品はSF。","ch":["FC：ねずみ鋳鉄品","SC：炭素鋼鋳鋼品","SCS：ステンレス鋼鋳鋼品","SS：炭素鋼鍛鋼品"]},{"y":2021,"n":1,"t":"ox","cat":"工作機械・FA","q":"直立ボール盤における振りとは、取り付けることができる工作物の最大直径のことである。","a":"○","e":"「振り」は主軸中心からコラムまでの距離の2倍で、取り付けられる工作物の最大直径を表す。"},{"y":2021,"n":2,"t":"ox","cat":"工作機械・FA","q":"横フライス盤の主軸は、地面に対して垂直である。","a":"×","e":"横フライス盤の主軸は地面に対して水平。主軸が垂直なのは立てフライス盤。"},{"y":2021,"n":3,"t":"ox","cat":"工作機械・FA","q":"オートローダは、工作機械などに、工作物を自動的に取付け、取外しをする装置である。","a":"○","e":"オートローダの定義そのもの。部品を整列して送り出すのはパーツフィーダ。"},{"y":2021,"n":4,"t":"ox","cat":"電気・電子","q":"下図に示す回路に流れる電流Iは、0.5Aである。","a":"○","e":"50Ωの並列は25Ω、これに5Ωを直列で30Ω。20Ωとの並列は30×20/(30+20)＝12Ω。I＝6V÷12Ω＝0.5A。","fig":"2021_q4"},{"y":2021,"n":5,"t":"ox","cat":"電気・電子","q":"三相誘導電動機の極数が4極、電源周波数が50Hz、すべり2％の場合の回転数は、1,470min⁻¹である。","a":"○","e":"同期速度＝120×50/4＝1,500min⁻¹。1,500×(1−0.02)＝1,470min⁻¹。"},{"y":2021,"n":6,"t":"ox","cat":"電気・電子","q":"リレーの接点のうちb接点は、リレーのコイルに電流が流れている間だけ、接点が閉じた状態となる。","a":"×","e":"b接点（ブレーク接点）は通常閉じており、コイルが励磁されている間は開く。閉じるのはa接点（メーク接点）。"},{"y":2021,"n":7,"t":"ox","cat":"保全管理","q":"性能稼働率は、速度稼働率と正味稼働率の積で表される。","a":"○","e":"性能稼働率＝速度稼働率×正味稼働率。"},{"y":2021,"n":8,"t":"ox","cat":"保全管理","q":"保全方式の1つであるTBMの例として、クレーンの月例点検が挙げられる。","a":"○","e":"TBM（時間基準保全）は一定期間ごとに行う予防保全。月例点検はその典型例。"},{"y":2021,"n":9,"t":"ox","cat":"保全管理","q":"バスタブ曲線において、摩耗故障期間では、時間経過とともに故障率が低下する。","a":"×","e":"摩耗故障期間は劣化の進行により故障率が時間とともに上昇する。低下するのは初期故障期間。"},{"y":2021,"n":10,"t":"ox","cat":"保全管理","q":"ある設備において、設備の稼働時間の合計が240時間、故障停止回数が6回、故障の修復にかかった時間の合計が60時間であった。このときのMTBFは40時間である。","a":"○","e":"MTBF＝稼働時間÷故障回数＝240÷6＝40時間。なおMTTR＝60÷6＝10時間。"},{"y":2021,"n":11,"t":"ox","cat":"保全管理","q":"故障の解析手法の1つであるFMEAは、トップダウン方式で進めていく。","a":"×","e":"FMEAは構成部品の故障モードから上位への影響を調べるボトムアップ手法。トップダウンはFTA。"},{"y":2021,"n":12,"t":"ox","cat":"保全管理","q":"減価償却費は、設備が劣化または故障しなかったならば得られていた利益である。","a":"×","e":"この説明は機会損失費。減価償却費は設備の取得費用を耐用年数にわたり費用配分したもの。"},{"y":2021,"n":13,"t":"ox","cat":"振動・破面解析","q":"設備の異常振動の判定法のうち、複数台の同一機種を同一条件で測定して比較判定する方法を、相互判定法という。","a":"○","e":"判定法には絶対判定法・相対判定法（同一設備の経時比較）・相互判定法（同一機種間の比較）がある。"},{"y":2021,"n":14,"t":"ox","cat":"品質管理","q":"抜取検査における生産者危険とは、検査を行った際に合格とすべきロットを不合格としてしまう確率である。","a":"○","e":"生産者危険（α）は良品ロットを誤って不合格にする確率。逆に不良ロットを合格させる確率が消費者危険（β）。"},{"y":2021,"n":15,"t":"ox","cat":"品質管理","q":"抜取検査において、OC曲線とは、ロットの不良率と検査合格率との関係を示す曲線である。","a":"○","e":"OC曲線（検査特性曲線）の定義どおり。"},{"y":2021,"n":16,"t":"ox","cat":"品質管理","q":"ある製品の重量を測定した結果、7g、9g、10g、11g、13gの5個のデータが得られた。これらの製品の標準偏差は2gである。","a":"○","e":"平均10g、偏差−3,−1,0,+1,+3、二乗和20。20÷5＝4、√4＝2gとなる。"},{"y":2021,"n":17,"t":"ox","cat":"品質管理","q":"np管理図は、検査する群の大きさが一定でないときに用いられる。","a":"×","e":"np管理図は群の大きさが一定のときに不適合品数を管理する。群の大きさが変わる場合はp管理図（不適合品率）。"},{"y":2021,"n":18,"t":"ox","cat":"機械材料","q":"ステンレス鋼は、軟鋼よりも熱伝導率が高い。","a":"×","e":"ステンレス鋼の熱伝導率は軟鋼のおよそ1/3程度と低い。"},{"y":2021,"n":19,"t":"ox","cat":"機械材料","q":"青銅は、主成分がCuとZnの合金である。","a":"×","e":"青銅はCu－Sn。Cu－Znは黄銅。"},{"y":2021,"n":20,"t":"ox","cat":"機械材料","q":"高い硬度を必要とする材料に施す熱処理は、高温焼戻より、低温焼戻しの方が適している。","a":"○","e":"焼戻し温度が高いほど硬さは低下し、じん性が増す。硬さを残したい場合は低温焼戻し（150〜200℃程度）。"},{"y":2021,"n":21,"t":"ox","cat":"安全衛生","q":"KYT（危険予知訓練）の4ラウンド法において、4ラウンド目に行うのは、対策樹立である。","a":"×","e":"4ラウンド法は 1R現状把握 → 2R本質追究 → 3R対策樹立 → 4R目標設定。対策樹立は3ラウンド目。"},{"y":2021,"n":22,"t":"ox","cat":"安全衛生","q":"C火災を消火する方法の1つとして、強化液消火薬剤を棒状放射することが挙げられる。","a":"×","e":"C火災（電気火災）で棒状放射すると感電のおそれがある。霧状放射であれば適用できる。"},{"y":2021,"n":23,"t":"ox","cat":"安全衛生","q":"フールプルーフの例として、プレス機械に組み込まれた両手押しボタン式の安全機構が挙げられる。","a":"○","e":"人が誤った操作をしても危険が生じないようにする仕組みがフールプルーフ。両手押しボタンはその代表例。"},{"y":2021,"n":24,"t":"ox","cat":"安全衛生","q":"SDS（安全データシート）は、設備で発生した災害の内容と、その対策を記録した資料である。","a":"×","e":"SDSは化学物質の危険有害性、人体への影響、取扱い・貯蔵上の注意、応急措置などを記載した文書。"},{"y":2021,"n":25,"t":"ox","cat":"安全衛生","q":"労働安全衛生法において、動力により駆動されるプレス機械を3台以上有する事業所では、プレス機械作業主任者を選任しなければならないと定められている。","a":"×","e":"動力プレス5台以上の事業場でプレス機械作業主任者の選任が必要。"},{"y":2021,"n":26,"t":"mc","cat":"機械要素","q":"ねじに関する記述のうち、適切なものはどれか。","a":"ウ","e":"有効径は、ねじ溝の幅とねじ山の幅が等しくなる仮想円筒の直径で、ねじ山が四角い角ねじには定義されない。ア：並目のピッチは細目より大きい。イ：ボールねじの機械効率は90％以上。エ：台形ねじは三角ねじよりねじ山の角度が小さく摩擦力は小さい。","ch":["呼び径が同じ場合、並目ねじは、細目ねじよりもピッチが小さい。","ボールねじの機械効率は、約50％である。","角ねじには、有効径がない。","台形ねじは、三角ねじよりも摩擦力が大きい。"]},{"y":2021,"n":27,"t":"mc","cat":"機械要素","q":"歯車に関する記述のうち、適切でないものはどれか。","a":"エ","e":"やまば歯車はねじれ方向が逆の2組のはすば歯車の組合せで、スラスト（軸方向力）が打ち消され発生しない。","ch":["はすば歯車は、2軸の相対位置が平行な場合に用いられる。","まがりばかさ歯車は、高負荷・高速運転に適するため、自動車や船舶の最終減速装置などに用いられる。","内歯車は、円筒の内側に歯を刻んだもので、かみ合う外歯車との回転方向は同一である。","やまば歯車は、軸方向の力が発生する。"]},{"y":2021,"n":28,"t":"mc","cat":"機械要素","q":"機械の主要構成要素に関する記述のうち、適切なものはどれか。","a":"ア","e":"くらキーは軸を削らず、キーと軸の間の摩擦力だけでトルクを伝えるため軽荷重用。イ：固定軸継手は軸心のずれを許容できない。ウ：逆曲げによる亀裂が問題になるのはテンションプーリを外側に設けた場合。エ：直動カムは原動節が直線運動をするもの。","ch":["くらキーは、打ち込みによる摩擦力のみでトルクを伝達するため、主に軽荷重用として使われる。","固定軸継手は、オルダム軸継手と比べ、アライメントの許容範囲が大きい。","Vベルト駆動装置において、Vベルトの内側にテンションプーリを設置する場合は、接触角度が増し、亀裂が発生しやすくなる。","直動カムは、原動節が回転運動をするものである。"]},{"y":2021,"n":29,"t":"mc","cat":"測定機器","q":"くぼみ測定をしない硬さ試験として、適切なものはどれか。","a":"ア","e":"ショア硬さ試験はダイヤモンドハンマを落下させ、その跳ね上がり高さから硬さを求める反発式で、くぼみ（圧痕）の測定をしない。他の3つは圧子を押し込んだ圧痕の大きさや深さから求める。","ch":["ショア硬さ試験","ビッカース硬さ試験","ロックウェル硬さ試験","ブリネル硬さ試験"]},{"y":2021,"n":30,"t":"mc","cat":"測定機器","q":"機械の点検に使用する測定器具に関する記述のうち、適切なものはどれか。","a":"ア","e":"白金測温抵抗体はおよそ−200〜660℃、ニッケルはおよそ−50〜300℃で、白金の方が広い。イ：予測できないときは最大レンジから。ウ：容積式は粘度が高いほど漏れが少なく精度が良い。エ：押し込むと長針は右回り（時計回り）に動く。","ch":["白金を用いた抵抗温度計は、ニッケルを用いた抵抗温度計よりも測定温度範囲が広い。","回路計（テスタ）を用いた電圧測定において、測定値が予測できないときは、最小の測定レンジから測定を始める。","容積式流量計は、測定する流体の粘度が低いほど測定精度が良くなる。","ダイヤルゲージの長針は、プランジャ（スピンドル）を押し込むときに反時計回りに動く。"]},{"y":2021,"n":31,"t":"mc","cat":"振動・破面解析","q":"機械に生じる現象と、その影響で発生した振動の測定パラメータの組合せとして、適切でないものはどれか。","a":"ア","e":"ミスアライメントは回転数の1〜2倍程度の低い周波数で現れるので、変位または速度で測る。加速度は高周波（キャビテーション、転がり軸受の傷、歯車の異常など）の検出に適する。","ch":["現象名：ミスアライメント　測定パラメータ：加速度","現象名：キャビテーション　測定パラメータ：加速度","現象名：アンバランス　測定パラメータ：変位","現象名：軸の曲がり　測定パラメータ：変位"]},{"y":2021,"n":32,"t":"mc","cat":"振動・破面解析","q":"オイルホワールに関する記述のうち、適切なものはどれか。","a":"ア","e":"オイルホワールの周波数は回転周波数の約1/2、振回り方向は軸の回転方向と同じ。イとエはオイルホイップの特徴。","ch":["発生する周波数は、回転周波数の約1/2である。","発生する周波数は、回転軸の一次危険速度の周波数と一致する。","振回りの方向は、軸の回転方向と逆である。","軸の回転数が、回転軸の一次危険速度の2倍以上となったときに発生する。"]},{"y":2021,"n":33,"t":"mc","cat":"溶接・非破壊検査","q":"溶接において、アンダーカットに関する記述として、適切なものはどれか。","a":"イ","e":"アンダカットは止端部に沿って母材が掘られ、溶着金属で満たされずに残った溝。ウはオーバラップ、エはアークストライクの説明。","ch":["溶接金属中に発生した気泡が、浮かび上がるときに作るくぼみ孔である。","母材または既溶接の上に溶接して生じた止端の溝である。","溶接金属が、母材に融合しないで重なる現象である。","母材の上に瞬間的にアークを飛ばし、直ちに切ることである。"]},{"y":2021,"n":34,"t":"mc","cat":"油圧・空気圧","q":"ポンプや配管に生じる異常に関する記述のうち、適切でないものはどれか。","a":"ア","e":"アの内容はキャビテーションの説明。サージングは、ポンプが自励振動を起こし、吐出圧力と吐出量が周期的に変動する現象。","ch":["サージングは、ポンプ内の流れに局部的な真空を生じ、水が気化して気泡が発生する現象である。","ウォータハンマは、水圧管内の水量を急に遮断したときに、水流の慣性で管内に衝撃や振動が発生する現象である。","キャビテーションは、流体の流れの中で、短時間に泡の発生と消滅が起きる現象である。","エロージョンは、粒子の衝突により、配管内面などが、徐々に剥離する現象である。"]},{"y":2021,"n":35,"t":"mc","cat":"潤滑","q":"給油方式に関する文中の（　）内に当てはまる語句として、適切なものはどれか。\n「（　）潤滑は、高速回転の転がり軸受に適用可能であり、常に新しい油が供給される給油方式である。」","a":"エ","e":"噴霧（オイルミスト）潤滑は圧縮空気で霧状の油を送るため、常に新しい油が供給され、冷却効果もあり高速回転の転がり軸受に適する。","ch":["飛沫","油浴","灯心","噴霧"]},{"y":2021,"n":36,"t":"mc","cat":"潤滑","q":"潤滑油の試験項目に関する記述のうち、適切なものはどれか。","a":"ウ","e":"流動点の定義どおり。ア：動粘度＝粘度÷密度。イ：火源なしで発火する温度は発火点。エ：酸価は酸性成分を中和するのに要する水酸化カリウムのmg数。","ch":["動粘度は、同一圧力において、その液体が0℃のときの粘度と、20℃のときの粘度の比である。","引火点は、酸素中で可燃性物質を加熱したとき、火源を近づけなくても発火し、燃焼を開始する最低の温度である。","流動点は、試料を45℃に加熱した後、かき混ぜないで冷却したとき、試料が流動する最低温度である。","酸価は、試料1g中に含まれる塩基性成分を中和するのに要する塩酸のmg数である。"]},{"y":2021,"n":37,"t":"mc","cat":"機械工作法","q":"機械工作法に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"湿式ラッピングは加工能率が高いが仕上面は光沢が出にくい。光沢のある鏡面に仕上がるのは乾式ラッピング。","ch":["電子ビーム加工は、ステンレス鋼や銅などの溶接が可能である。","電解研磨とは、被加工物に電流を流し、表面の突起部分を溶解する方法である。","湿式ラッピングは、乾式ラッピングに比べ、仕上がりに光沢が出る。","きさげ作業は、工作機械などの摺動面の仕上げとして行う。"]},{"y":2021,"n":38,"t":"mc","cat":"溶接・非破壊検査","q":"溶接に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"アークの保持が難しく溶込み不良を生じるのは溶接電流が小さすぎる場合。","ch":["ガス溶接は、温度調整によりひずみを少なく仕上げることができる。","チタン材料の溶接は、アルゴンなどの不活性ガス雰囲気または高真空中で行う。","被覆アーク溶接において、溶接電流が大きいとアークの保持が困難となり溶込み不良を生じる。","スポット溶接やシーム溶接などの電気抵抗溶接は、圧接に分類される。"]},{"y":2021,"n":39,"t":"mc","cat":"溶接・非破壊検査","q":"オーステナイト系ステンレス鋼製の製品の表面と内部に生じた欠陥に適用可能な非破壊試験の組合せとして、適切なものはどれか。","a":"イ","e":"オーステナイト系ステンレス鋼は非磁性のため磁粉探傷試験が使えない。表面欠陥は浸透探傷、内部欠陥は放射線透過試験を用いる。","ch":["表面：磁粉探傷試験　内部：超音波探傷試験","表面：浸透探傷試験　内部：放射線透過試験","表面：浸透探傷試験　内部：磁粉探傷試験","表面：磁粉探傷試験　内部：放射線透過試験"]},{"y":2021,"n":40,"t":"mc","cat":"油圧・空気圧","q":"油圧機器に関する記述のうち、適切なものはどれか。","a":"イ","e":"シリンダ速度は流量で決まるため、ポンプの容積効率低下は速度低下の原因になる。ア：許容ドレン圧力は0.03MPa程度。ウ：背圧がかかると二次側圧力は上昇する。エ：ブリードオフ回路は余剰油だけをタンクへ逃がすため動力損失は小さい。","ch":["油圧モータのオイルシールは、一般的に、ドレン圧力が0.3MPa程度までならば使用できる。","油圧シリンダの速度低下の原因の1つとして、油圧ポンプの容積効率の低下や圧力上昇の不良などが考えられる。","減圧弁のドレンポートに必要以上の背圧がかかると、二次側の圧力は低下する。","ブリードオフ回路は、メータイン回路やメータアウト回路と比べ、動力損失が大きい。"]},{"y":2021,"n":41,"t":"mc","cat":"油圧・空気圧","q":"油圧、空気圧機器に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"交流ソレノイドはプランジャが吸引されないと大きな電流が流れ続けるため焼損しやすい。焼損しにくいのは直流ソレノイド。","ch":["空油変換器を使用することで、シリンダの低速での動作を安定させることができる。","自動可変式ルブリケータには、空気の流れが少ないときも潤滑油の供給量が一定になるよう可変絞り機構が設けられている。","交流ソレノイドは、直流ソレノイドと比較してソレノイドコイルの焼損が発生しにくい。","アキュムレータに封入するガスは、窒素を使用する。"]},{"y":2021,"n":42,"t":"mc","cat":"油圧・空気圧","q":"油圧シリンダの不具合に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"シリンダの出力は圧力×受圧面積で決まり、流量調整弁は流量＝速度に関わる要素。流量調整弁の不良は速度の不具合の原因であって、出力低下の原因ではない。","ch":["出力低下の原因として、リリーフバルブの圧力上昇不良が考えられる。","速度低下の原因として、油圧ポンプの容積効率の低下が考えられる。","出力低下の原因として、流量調整弁の不良が考えられる。","速度低下の原因として、配管などの圧力損失の増大が考えられる。"]},{"y":2021,"n":43,"t":"mc","cat":"油圧・空気圧","q":"作動油に加えられた添加剤に関する記述のうち、適切なものはどれか。","a":"エ","e":"油性向上剤（油性剤）は極性分子が金属面に吸着して境界潤滑膜をつくり、低荷重域での摩擦・摩耗を減らす。ア・イは清浄剤（高温）と分散剤（低温）の説明が逆。ウは腐食防止剤（防錆剤）の説明で、極圧添加剤は高荷重下で焼付きを防ぐ。","ch":["清浄剤は、低温運転におけるスラッジの生成を防止する効果がある。","分散剤は、高温運転における劣化生成物の沈積を防止する効果がある。","極圧添加剤は、金属面が化学的に腐食されることを防止する効果がある。","油性向上剤は、低荷重下において摩擦面に油膜を形成し、摩擦および摩耗を減少させる効果がある。"]},{"y":2021,"n":44,"t":"mc","cat":"機械材料","q":"下表に示すプラスチック材料の樹脂名とその性質について、A〜Dに当てはまる樹脂名の組合せとして、適切なものはどれか。","a":"ア","e":"A：熱可塑性で水や電気を通さず耐熱性に乏しい→ポリエチレン。B：熱可塑性で無色透明・光透過率がほぼ100％→アクリル樹脂。C：熱硬化性でベークライトともよばれる→フェノール樹脂。D：熱硬化性で常温・常圧で成形できる→エポキシ樹脂。","ch":["A：ポリエチレン　B：アクリル樹脂　C：フェノール樹脂　D：エポキシ樹脂","A：ポリ塩化ビニル　B：エポキシ樹脂　C：アクリル樹脂　D：フェノール樹脂","A：フェノール樹脂　B：アクリル樹脂　C：ポリエチレン　D：ポリ塩化ビニル","A：エポキシ樹脂　B：フェノール樹脂　C：ポリ塩化ビニル　D：ポリエチレン"],"fig":"2021_q44"},{"y":2021,"n":45,"t":"mc","cat":"機械材料","q":"めっきに関する記述のうち、適切でないものはどれか。","a":"イ","e":"工業用（硬質）クロムめっきは耐摩耗性を目的とするため、装飾用より厚い皮膜を施す。","ch":["銅めっきは、クロムめっきなどの下地めっきとして用いられる。","工業用クロムめっきは、装飾用クロムめっきよりも皮膜が薄く施される。","すずめっきは、人体への毒性が低いため、食品用器具などに施される。","亜鉛めっきにおいて、亜鉛皮膜の上に、化学的にクロム酸の皮膜を形成・密着させる方法をクロメート処理という。"]},{"y":2021,"n":46,"t":"mc","cat":"機械材料","q":"金属材料の表面処理に関する文中の（　）内に当てはまる語句として、適切なものはどれか。\n「金属材料にクロムめっきを施すと、めっき層に存在する（　）の影響で、強度が低下することがある。」","a":"エ","e":"めっき時に発生した水素が取り込まれ、水素ぜい性により強度が低下することがある。対策はベーキング（脱水素処理）。","ch":["窒素","塩素","炭素","水素"]},{"y":2021,"n":47,"t":"mc","cat":"材料力学","q":"下図に示す滑車の仕掛けで、物体に働く力Wが800Nのとき、ロープを引く力Fとして適切なものはどれか。","a":"イ","e":"動滑車を2個組み合わせているので、荷重を支えるロープは4本になり、引く力は1/4。800÷4＝200N。","ch":["100N","200N","400N","800N"],"fig":"2021_q47"},{"y":2021,"n":48,"t":"mc","cat":"材料力学","q":"下図に示すように、2つの部品を直径16mmのピンで連結して、8kNの荷重で横に引っ張ったとき、ピンに生じるせん断応力としてもっとも近い数値はどれか。","a":"エ","e":"断面積A＝π×16²/4＝201mm²。一面せん断なのでτ＝8,000N÷201mm²≒39.8N/mm²＝39.8MPa。","ch":["10.0MPa","15.7MPa","20.0MPa","39.8MPa"],"fig":"2021_q48"},{"y":2021,"n":49,"t":"mc","cat":"機械材料","q":"JISにおいて、材料記号と規格名称の組合せとして、適切でないものはどれか。","a":"エ","e":"SSは一般構造用圧延鋼材。炭素鋼鍛鋼品はSF。","ch":["FC：ねずみ鋳鉄品","SC：炭素鋼鋳鋼品","SCS：ステンレス鋼鋳鋼品","SS：炭素鋼鍛鋼品"]},{"y":2021,"n":50,"t":"mc","cat":"製図","q":"JISにおいて、表面性状の図示記号の構成として、適切なものはどれか。","a":"ウ","e":"表面性状の図示記号は、対象面を表す線に対して60°に開いた長短2本の直線で構成し、要求事項を指示するときは長い方の脚に横線を付ける。表面性状パラメータ（Ra 25）は、その横線のすぐ下の位置“a”に記入する。横線の上側は位置“c”＝加工方法。アは値を横線の上側に、イ・エは面を表す線の近くに記入しており誤り。","ch":["ア（図参照）","イ（図参照）","ウ（図参照）","エ（図参照）"],"fig":"2021_q50"},{"y":2022,"n":1,"t":"ox","cat":"工作機械・FA","q":"直立ボール盤における振りとは、取り付けることができる工作物の最小直径のことである。","a":"×","e":"「振り」は取り付けられる工作物の最大直径。主軸中心からコラムまでの距離の2倍。"},{"y":2022,"n":2,"t":"ox","cat":"工作機械・FA","q":"生産システムにおけるパーツフィーダとは、加工、組立などに供する部品を整列して所定の場所まで自動的に送り出す装置である。","a":"○","e":"パーツフィーダの定義どおり。工作物を機械へ自動的に着脱するのはオートローダ。"},{"y":2022,"n":3,"t":"ox","cat":"電気・電子","q":"下図に示す回路に流れる電流Iは、0.3Aである。","a":"×","e":"50Ωの並列25Ω＋5Ω＝30Ω。20Ωと並列で30×20/50＝12Ω。I＝6V÷12Ω＝0.5Aとなり0.3Aではない。","fig":"2022_q3"},{"y":2022,"n":4,"t":"ox","cat":"電気・電子","q":"三相誘導電動機のスターデルタ始動では、始動トルクは直入れ始動時の2分の1になる。","a":"×","e":"スターデルタ始動では相電圧が1/√3になり、始動電流・始動トルクとも直入れの1/3になる。"},{"y":2022,"n":5,"t":"ox","cat":"電気・電子","q":"電磁接触器の接点のうちb接点は、電磁接触器のコイルに電流が流れている間だけ、接点が開いた状態となる。","a":"○","e":"b接点（ブレーク接点）は通常閉、励磁中は開になる。記述のとおり。"},{"y":2022,"n":6,"t":"ox","cat":"保全管理","q":"時間稼働率は、速度稼働率と正味稼働率の積で表される。","a":"×","e":"速度稼働率×正味稼働率は性能稼働率。時間稼働率＝（負荷時間−停止時間）÷負荷時間。"},{"y":2022,"n":7,"t":"ox","cat":"保全管理","q":"ある設備において、設備の稼働時間の合計が160時間、故障停止回数が4回、故障の修復にかかった時間の合計が80時間であった。このときのMTTRは20時間である。","a":"○","e":"MTTR＝修復時間の合計÷故障回数＝80÷4＝20時間。"},{"y":2022,"n":8,"t":"ox","cat":"保全管理","q":"保全活動の効果指標となるPQCDSMEのうち、DはDelivery（納期）である。","a":"○","e":"P：生産性、Q：品質、C：コスト、D：納期、S：安全、M：モラール、E：環境。"},{"y":2022,"n":9,"t":"ox","cat":"保全管理","q":"故障の解析手法の1つであるFMEAは、トップダウン方式で進めていく。","a":"×","e":"FMEAはボトムアップ手法。トップダウンで展開するのはFTA。"},{"y":2022,"n":10,"t":"ox","cat":"保全管理","q":"ある設備において、負荷時間100時間のうち、故障停止が3回で故障停止時間はそれぞれ1.0時間、2.0時間、4.0時間であった。このときの故障度数率は、3％である。","a":"○","e":"故障度数率＝故障停止回数÷負荷時間×100＝3÷100×100＝3％。なお故障強度率は7÷100×100＝7％。"},{"y":2022,"n":11,"t":"ox","cat":"保全管理","q":"保全計画におけるMP設計とは、既存設備の保全情報を十分に反映させた設計である。","a":"○","e":"MP（保全予防）設計は、既存設備の保全データを新設備の設計に反映し、故障や保全の手間を最初から減らす活動。"},{"y":2022,"n":12,"t":"ox","cat":"振動・破面解析","q":"設備の種類をいくつかに分類し、測定した振動があるレベルを超えた場合に異常と判断する方法を、絶対判定法という。","a":"○","e":"絶対判定法は判定基準値と実測値を比較する方法。ISO規格やJIS等の判定基準が用いられる。"},{"y":2022,"n":13,"t":"ox","cat":"測定機器","q":"機械の異常発見を目的として設置する機器のうち、非接触式のセンサの例として、リミットスイッチが挙げられる。","a":"×","e":"リミットスイッチは対象物が機械的に押すことで動作する接触式。非接触式は近接スイッチや光電スイッチなど。"},{"y":2022,"n":14,"t":"ox","cat":"品質管理","q":"連関図法において、下図のAには「手段」を記入する。","a":"×","e":"連関図法は原因と結果が複雑に絡む問題を整理する手法で、中心には「問題（結果）」を置き、その周りに要因を配置する。","fig":"2022_q14"},{"y":2022,"n":15,"t":"ox","cat":"品質管理","q":"時間的な変化や傾向をつかむには、折れ線グラフよりもマトリックス図が適している。","a":"×","e":"時間的な変化や傾向をみるのは折れ線グラフ。マトリックス図は2つ以上の要素の対応関係を整理する手法。"},{"y":2022,"n":16,"t":"ox","cat":"品質管理","q":"X̄－R管理図において、下図のX̄管理図は、管理限界線から外れている。","a":"×","e":"図の点はすべて上方管理限界（UCL）と下方管理限界（LCL）の内側にあり、管理限界から外れていない。","fig":"2022_q16"},{"y":2022,"n":17,"t":"ox","cat":"品質管理","q":"c管理図を用いる例として、それぞれの面積が異なるアルミ板を生産している工程の、表面上の傷の発生状況の管理が挙げられる。","a":"×","e":"c管理図は単位（大きさ）が一定の場合の欠点数を管理する。面積が異なる＝単位が一定でない場合は単位あたりの欠点数を扱うu管理図。"},{"y":2022,"n":18,"t":"ox","cat":"機械材料","q":"青銅は、主成分がCuとZnの合金である。","a":"×","e":"青銅はCu－Sn。Cu－Znは黄銅。"},{"y":2022,"n":19,"t":"ox","cat":"機械材料","q":"ステンレス鋼は、軟鋼よりも熱伝導率が低い。","a":"○","e":"ステンレス鋼の熱伝導率は軟鋼のおよそ1/3程度と低い。"},{"y":2022,"n":20,"t":"ox","cat":"機械材料","q":"鋼の残留応力を低減する方法の1つとして、低温焼なましが挙げられる。","a":"○","e":"低温焼なまし（応力除去焼なまし）は変態点以下で加熱・徐冷し残留応力を除去する。"},{"y":2022,"n":21,"t":"ox","cat":"安全衛生","q":"労働者が1,000人の事業場で、1人あたりの年間総労働時間が1,500時間の場合、この期間に災害による死傷者数を3人出したときの度数率は、2である。","a":"○","e":"度数率＝死傷者数÷延べ実労働時間数×1,000,000＝3÷(1,000×1,500)×1,000,000＝2。"},{"y":2022,"n":22,"t":"ox","cat":"安全衛生","q":"KYT（危険予知訓練）の4ラウンド法において、3ラウンド目に行うのは、対策樹立である。","a":"○","e":"1R現状把握 → 2R本質追究 → 3R対策樹立 → 4R目標設定。"},{"y":2022,"n":23,"t":"ox","cat":"安全衛生","q":"B火災を消火する方法の1つとして、水（浸潤剤等入）消火器で棒状放射することが挙げられる。","a":"×","e":"B火災は油火災。水を棒状放射すると油が飛散・拡大して危険。B火災には粉末・泡・二酸化炭素消火器などを用いる。"},{"y":2022,"n":24,"t":"ox","cat":"安全衛生","q":"フェイルセーフ設計の例として、回転物への巻き込まれ防止のカバーが挙げられる。","a":"×","e":"カバーは危険源を隔離するガード。フェイルセーフは故障・異常時に安全側へ働く設計。"},{"y":2022,"n":25,"t":"ox","cat":"安全衛生","q":"労働安全衛生法において、建設業や製造業等の業種に属する事業場で労働者が常時50人以上の事業場では、安全管理者を選任しなければならないと定められている。","a":"○","e":"安衛法により、林業・建設業・製造業など特定の業種で常時50人以上の労働者を使用する事業場は安全管理者を選任する。"},{"y":2022,"n":26,"t":"mc","cat":"機械要素","q":"1組の平歯車において、モジュール5mm、中心距離160mm、速度伝達比3の場合、それぞれの歯車の歯数の組合せとして、適切なものはどれか。","a":"エ","e":"中心距離＝m(z₁+z₂)/2 より z₁+z₂＝2×160÷5＝64。速度伝達比3なのでz₂＝3z₁、4z₁＝64、z₁＝16、z₂＝48。","ch":["12と32","12と36","16と32","16と48"]},{"y":2022,"n":27,"t":"mc","cat":"機械要素","q":"ねじに関する記述のうち、適切なものはどれか。","a":"ア","e":"有効径はねじ溝の幅とねじ山の幅が等しくなる仮想円筒の直径で、ねじ山が四角い角ねじには定義されない。イ：台形ねじは三角ねじより山の角度が小さく摩擦力は小さい。ウ：並目のピッチは細目より大きい。エ：ボールねじの機械効率は90％以上。","ch":["角ねじには、有効径がない。","台形ねじは、三角ねじよりも摩擦力が大きい。","呼び径が同じ場合、並目ねじは、細目ねじよりもピッチが小さい。","ボールねじの機械効率は、約50％である。"]},{"y":2022,"n":28,"t":"mc","cat":"工作機械・FA","q":"旋盤の静的精度検査項目として、適切でないものはどれか。","a":"イ","e":"静的精度検査は無負荷状態での幾何学的精度（真直度・振れ・ピッチ誤差など）を調べるもの。曲げ剛性は荷重をかけて変形量を測る剛性試験であり静的精度検査項目ではない。","ch":["ベッド滑り面の真直度","主軸の曲げ剛性","主軸端外面の振れ","親ねじの累積ピッチ誤差"]},{"y":2022,"n":29,"t":"mc","cat":"機械要素","q":"クレーン用ワイヤロープに関する記述のうち、適切でないものはどれか。","a":"エ","e":"ワイヤロープの直径は外接円の直径を2箇所以上で測定し、その平均値をとる。最も長い箇所だけを測るのではない。","ch":["ワイヤロープにおいて、ウォーリントンシールタイプは、フィラータイプに比べ、疲労破断に対する安全率が高い。","ワイヤロープの1撚りの間において、フィラ線を除く素線の数が10％以上切断している場合は、使用してはならない。","ワイヤロープの直径が公称径に対して7％を超えて減少している場合には、使用してはならない。","ワイヤロープの直径は、外接円の直径のもっとも長い箇所を測定する。"]},{"y":2022,"n":30,"t":"mc","cat":"振動・破面解析","q":"振動および振動計に関する記述のうち、適切なものはどれか。","a":"エ","e":"アンバランスは回転周波数（1,500rpm＝25Hz）で現れる低〜中周波の振動なので、速度モードが有効。ア：高周波まで測れるのは圧電型加速度センサ。イ：触針式は高域の特性が悪い。ウ：1,200rpm＝1,200/60＝20Hz。","ch":["動電型速度センサは、圧電型加速度センサに比べ、高い周波数まで測定可能である。","手持ちの触針式のセンサは、マグネット式と比較して、高域帯の周波数特性に有効である。","1,200rpmで回転している軸の回転周波数は1,200Hzである。","1,500rpmで回転する送風機のアンバランスを振動測定で検知するには、速度測定モードが有効である。"]},{"y":2022,"n":31,"t":"mc","cat":"振動・破面解析","q":"破面解析に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"へき開面に沿って形成され、腐食環境や亀裂進展が速い場合に現れるのは脆性ストライエーション。延性ストライエーションは延性的な塑性変形を伴って形成される。","ch":["ストライエーションは、繰り返し荷重の1サイクルごとに形成される縞模様のことをいう。","フラクトグラフィとは、破断面の破壊の状態を観察・解析することをいう。","延性ストライエーションは、へき開面に沿って形成され、腐食性雰囲気での疲労破面や亀裂進展速度が速い場合などに観察される。","シェブロンパターンは、山形の模様があり脆性破壊が推定される。"]},{"y":2022,"n":32,"t":"mc","cat":"振動・破面解析","q":"オイルホイップに関する記述のうち、適切でないものはどれか。","a":"ア","e":"オイルホイップは油膜が原因で起こる自励振動。アンバランスのような外力によって生じる強制振動ではない。","ch":["強制振動の一種である。","発生する周波数は、回転軸の一次危険速度の周波数と一致する。","振回りの方向は、軸の回転方向と同じである。","軸の回転数が、回転軸の一次危険速度の2倍以上となったときに発生する。"]},{"y":2022,"n":33,"t":"mc","cat":"溶接・非破壊検査","q":"溶接の不具合と対策に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"オーバラップは溶着金属が母材に融合せず重なる欠陥で、溶接電流が大きすぎる・溶接速度が遅いことが原因。対策は電流を下げること。増大させると悪化する。","ch":["ピットの対策の1つとして、アーク長を短くすることが挙げられる。","ブローホールの対策の1つとして、母材の水分を除去することが挙げられる。","オーバーラップの対策の1つとして、溶接電流の増大が挙げられる。","アンダーカットの対策の1つとして、溶接速度の低減が挙げられる。"]},{"y":2022,"n":34,"t":"mc","cat":"油圧・空気圧","q":"ポンプや配管に生じる異常に関する記述のうち、適切でないものはどれか。","a":"エ","e":"粒子の衝突によって配管内面が徐々に剥離するのはエロージョン。コロージョンは化学的・電気化学的な腐食。","ch":["サージングは、ポンプ内で自励振動を起こし、特有の定まった周期で吐出圧力および吐出量が変動する現象である。","ウォータハンマは、水圧管内の水量を急に遮断したときに、水流の慣性で管内に衝撃や振動が発生する現象である。","キャビテーションは、流体の流れの中で、短時間に泡の発生と消滅が起きる現象である。","コロージョンは、粒子の衝突により、配管内面などが、徐々に剥離する現象である。"]},{"y":2022,"n":35,"t":"mc","cat":"潤滑","q":"給油方式に関する文中の（　）内に当てはまる語句として、適切なものはどれか。\n「（　）潤滑は、高速回転の転がり軸受に適用可能であり、油を反復式で給油する方式である。」","a":"イ","e":"油浴潤滑は油だめの油を繰り返し使う反復式の給油方式。滴下・灯心・噴霧は使った油を回収しない全損失（消費）式。","ch":["滴下","油浴","灯心","噴霧"]},{"y":2022,"n":36,"t":"mc","cat":"潤滑","q":"潤滑油の試験項目に関する記述のうち、適切でないものはどれか。","a":"エ","e":"酸価は、試料1g中の酸性成分を中和するのに要する水酸化カリウム（KOH）のmg数。塩基性成分を塩酸で中和するのは中和価のうち塩基価。","ch":["動粘度は、粘度をその液体の同一状態（温度、圧力）における密度で除した商である。","引火点は、規定条件下で引火源を試料蒸気に近づけたとき、試料蒸気が閃光を発して瞬間的に燃焼し、かつその炎が液面上を伝播する試料の最低温度を101.3kPaの値に気圧補正した温度のことである。","流動点は、試料を45℃に加熱した後、試料をかき混ぜないで規定の方法で冷却したとき、試料が流動する最低温度である。","酸価は、試料1g中に含まれる塩基性成分を中和するのに要する塩酸のmg数である。"]},{"y":2022,"n":37,"t":"mc","cat":"機械工作法","q":"鍛造に関する記述のうち、適切なものはどれか。","a":"エ","e":"熱間鍛造は再結晶温度以上で行うため、加工硬化してもすぐ再結晶して軟化し、大きな変形が可能。ア：一対の型で成形するのは型鍛造。イ：ねじは圧造（頭部成形）ののちに転造する。ウ：再結晶が起こる温度は再結晶温度。","ch":["自由鍛造は、上下で一対になる型を用いて材料を圧縮成形する方法である。","ねじは、線材を転造したのちに、圧造してつくられる。","変形を加えた金属を加熱した時に、再結晶が起こる温度を鍛造温度という。","熱間鍛造では、鍛造されることで結晶が変形し硬化するが、すぐに再結晶化して軟化する。"]},{"y":2022,"n":38,"t":"mc","cat":"溶接・非破壊検査","q":"溶接に関する記述のうち、適切なものはどれか。","a":"イ","e":"スパッタは溶接中に飛散する金属粒。ア：スラグはフラックスが溶けて生じる非金属物質。ウ：フラックスは溶接棒の被覆剤（心線は金属線）。エ：端部を重ねるのは重ね継手で、突合せ継手は端面どうしを突き合わせる。","ch":["スラグは、溶接部に生じる金属物質である。","スパッタは、溶接中に飛散する金属粒などのことである。","フラックスは、被覆アーク溶接に用いる溶接棒の金属線である。","突合せ継手は、溶接をする2つの母材のそれぞれの端部を重ねて溶接する溶接継手である。"]},{"y":2022,"n":39,"t":"mc","cat":"溶接・非破壊検査","q":"鉄鋼製の製品の表面と内部に生じた欠陥に適用可能な非破壊試験の組合せとして、適切なものはどれか。","a":"エ","e":"鉄鋼は強磁性体なので表面欠陥は磁粉探傷試験が適する。内部欠陥は放射線透過試験（または超音波探傷試験）。浸透探傷は表面に開口した欠陥のみ、磁粉探傷は内部欠陥には使えない。","ch":["表面：磁粉探傷試験　内部：浸透探傷試験","表面：放射線透過試験　内部：超音波探傷試験","表面：放射線透過試験　内部：磁粉探傷試験","表面：磁粉探傷試験　内部：放射線透過試験"]},{"y":2022,"n":40,"t":"mc","cat":"油圧・空気圧","q":"油圧機器に関する記述のうち、適切なものはどれか。","a":"ウ","e":"スプール弁は弁体と穴のすきまで密封するため、閉位置でも微少な内部漏れが生じる。ア：許容ドレン圧力は0.03MPa程度。イ：設定圧以上で油を逃がすのはリリーフ弁。カウンタバランス弁は自重落下を防ぐため戻り側に背圧を与える弁。エ：ブリードオフ回路は動力損失が小さい。","ch":["油圧モータのオイルシールは、一般的に、ドレン圧力が0.3MPa程度までならば使用できる。","カウンタバランス弁は、回路内の圧力が設定圧力以上になると自動的に油圧を逃がす。","油圧バルブは、弁体がスプールの場合、閉位置の状態で若干の油漏れが発生する。","ブリードオフ回路は、メータイン回路やメータアウト回路と比べ、動力損失が大きい。"]},{"y":2022,"n":41,"t":"mc","cat":"油圧・空気圧","q":"油圧、空気圧機器に関する記述のうち、適切なものはどれか。","a":"ア","e":"シリンダの出力F＝圧力p×受圧面積A。イ：戻り側に背圧を与えて自重落下を防ぐのはカウンタバランス弁。アンロード弁はポンプ吐出油を低圧でタンクへ戻す弁。ウ：焼損しにくいのは直流ソレノイド。エ：変動負荷で安定した速度制御にはメータアウト回路が適する。","ch":["油圧シリンダの出力は、同一圧力の場合、シリンダ断面積が大きいほど大きくなる。","アンロード弁は、アクチュエータの戻り側に抵抗を与え、自重落下を防止するときに使用する。","交流ソレノイドは、直流ソレノイドと比較してソレノイドコイルの焼損が発生しにくい。","メータイン回路は、変動する負荷に対して安定した速度で制御する場合に使用する。"]},{"y":2022,"n":42,"t":"mc","cat":"油圧・空気圧","q":"油圧シリンダの不具合に関する記述のうち、適切でないものはどれか。","a":"ア","e":"流量調整弁は流量＝速度に関わる要素であり、出力（圧力×受圧面積）低下の原因にはならない。","ch":["出力低下の原因として、流量調整弁の不良が考えられる。","速度低下の原因として、配管などの圧力損失の増大が考えられる。","出力低下の原因として、リリーフバルブの圧力上昇不良が考えられる。","速度低下の原因として、油圧ポンプの容積効率の低下が考えられる。"]},{"y":2022,"n":43,"t":"mc","cat":"油圧・空気圧","q":"作動油に関する記述のうち、適切でないものはどれか。","a":"エ","e":"ウレタンゴムは加水分解するため、水を含む水-グリコール系作動油には使用できない。水-グリコール系にはニトリルゴムなどを用いる。","ch":["リン酸エステル系作動油は、ニトリルゴムパッキンに使用できない。","塩素化炭化水素作動油は、ふっ素ゴムパッキンに使用できる。","ジエステル油は、ブチルゴムパッキンに使用できない。","水-グリコール系作動油は、ウレタンゴムパッキンに使用できる。"]},{"y":2022,"n":44,"t":"mc","cat":"機械材料","q":"非金属材料に関する記述のうち、適切なものはどれか。","a":"エ","e":"エポキシ樹脂は熱硬化性で、常温・常圧で硬化・成形できる。ア：ポリエチレンは耐熱性に乏しい。イ：アクリル樹脂は熱可塑性。ウ：フェノール樹脂は熱硬化性。","ch":["ポリエチレンは、熱可塑性であり、耐熱性に優れる。","アクリル樹脂は、熱硬化性であり、完全に無色透明で、光の透過率は100％に近い。","フェノール樹脂は、熱可塑性であり、ベークライトともよばれ、耐熱性がある。","エポキシ樹脂は、熱硬化性であり、常温・常圧で成形できる。"]},{"y":2022,"n":45,"t":"mc","cat":"機械材料","q":"金属材料の表面処理に関する文中の（　）内に当てはまる語句として、適切なものはどれか。\n「金属材料にクロムめっきを施すと、めっき層に存在する（　）の影響で、強度が低下することがある。」","a":"エ","e":"めっき時に発生した水素による水素ぜい性で強度が低下することがある。対策はベーキング（脱水素処理）。","ch":["炭素","窒素","塩素","水素"]},{"y":2022,"n":46,"t":"mc","cat":"機械材料","q":"浸炭に関する記述のうち、適切でないものはどれか。","a":"エ","e":"浸炭は表面だけに炭素をしみ込ませて硬化させ、内部はじん性のある低炭素のまま残す処理。表面と内部の硬さは均一にならない。","ch":["主に低炭素の鋼に使用される。","浸炭剤中で長時間加熱することで、炭素をしみ込ませる。","焼入れと焼戻しは、浸炭処理後に行う。","表面層と内部の硬さを均一にすることができる。"]},{"y":2022,"n":47,"t":"mc","cat":"材料力学","q":"材料に関する記述のうち、適切なものはどれか。","a":"イ","e":"伸び＝5,000mm×0.001＝5mm。ア：1,600÷40＝40N/mm²。ウ：安全率＝570÷190＝3。エ：反力は左右それぞれ250N。","ch":["断面積40mm²の丸棒に、1,600Nの引張荷重が働いているときの引張応力は64N/mm²である。","長さ5mの丸棒を引っ張ったときの縦ひずみが0.1％の場合、伸びは5mmである。","機械構造用炭素鋼鋼材の基準強さが570MPaのとき、許容応力を190MPaとすると、安全率は5となる。","両端支持ばりで、中央に500Nの集中荷重が作用して、釣り合っているときの2つの支点の反力はそれぞれ500Nである。"]},{"y":2022,"n":48,"t":"mc","cat":"材料力学","q":"下図に示すように、2つの部品を直径16mmのピンで連結して、8kNの荷重で横に引っ張った時、ピンに生じるせん断応力としてもっとも近い数値はどれか。","a":"エ","e":"断面積A＝π×16²/4≒201mm²。一面せん断なのでτ＝8,000÷201≒39.8N/mm²＝39.8MPa。","ch":["10.0MPa","15.7MPa","20.0MPa","39.8MPa"],"fig":"2022_q48"},{"y":2022,"n":49,"t":"mc","cat":"機械材料","q":"JISにおいて、材料記号と規格名称の組合せとして、適切でないものはどれか。","a":"ア","e":"SKは炭素工具鋼鋼材。合金工具鋼鋼材はSKS・SKD・SKTなど。","ch":["SK：合金工具鋼鋼材","SWP：ピアノ線","FC：ねずみ鋳鉄品","SS：一般構造用圧延鋼材"]},{"y":2022,"n":50,"t":"mc","cat":"製図","q":"はめあいに関する記述のうち、適切でないものはどれか。","a":"イ","e":"一般には穴基準はめあいが用いられ、加工の難しい穴を基準として軸を仕上げる。","ch":["しまりばめは、穴の最大許容寸法に対して軸の最小許容寸法が等しいか、大きい場合のはめあいである。","複数の穴と軸のはめあいを加工する場合、一般的に軸の寸法を基準として穴を加工する。","すきまばめは、穴の最小許容寸法に対して軸の最大許容寸法が等しいか、小さい場合のはめあいである。","中間ばめは、穴の最小許容寸法に対して軸の最大許容寸法が等しいか、大きい場合、または穴の最大許容寸法に対して軸の最小許容寸法が等しいか、小さい場合のはめあいである。"]},{"y":2023,"n":1,"t":"ox","cat":"工作機械・FA","q":"立てフライス盤は、エンドミルを用いて側面・段差や溝などを加工するのに適している。","a":"○","e":"立てフライス盤は主軸が垂直で、エンドミルによる側面削り・溝加工・段差加工に適する。"},{"y":2023,"n":2,"t":"ox","cat":"工作機械・FA","q":"FAにおけるマニピュレータとは、互いに連結された関節で構成し、対象物をつかみ、動かすことを目的とした機械である。","a":"○","e":"マニピュレータの定義どおり。人の腕に相当する関節機構で対象物を保持・移動する。"},{"y":2023,"n":3,"t":"ox","cat":"電気・電子","q":"下図に示す回路において、抵抗①に流れる電流は、2Aである。","a":"○","e":"20Ωと30Ωの並列は20×30/50＝12Ω。全抵抗は8＋12＝20Ω、全電流は100÷20＝5A。並列部の電圧は5×12＝60V。30Ω（①）の電流は60÷30＝2A。","fig":"2023_q3"},{"y":2023,"n":4,"t":"ox","cat":"電気・電子","q":"三相誘導電動機の極数が4極、電源周波数が50Hz、すべり2％の場合の回転数は、1,530min⁻¹である。","a":"×","e":"同期速度＝120×50/4＝1,500min⁻¹。すべりがあるので回転数は同期速度より低く1,500×0.98＝1,470min⁻¹。"},{"y":2023,"n":5,"t":"ox","cat":"電気・電子","q":"交流ソレノイドの吸引力は、印加する電圧が同じ場合、電源周波数の低い方が小さくなる。","a":"×","e":"周波数が低いほどコイルのインピーダンスが小さくなり電流が増えるため、吸引力は大きくなる。"},{"y":2023,"n":6,"t":"ox","cat":"保全管理","q":"時間稼働率は、速度稼働率と正味稼働率の積で表される。","a":"×","e":"速度稼働率×正味稼働率は性能稼働率。時間稼働率＝（負荷時間−停止時間）÷負荷時間。"},{"y":2023,"n":7,"t":"ox","cat":"保全管理","q":"ある設備において、設備の稼働時間の合計が240時間、故障停止回数が6回、故障の修復にかかった時間の合計が60時間であった。このときのMTBFは10時間である。","a":"×","e":"MTBF＝240÷6＝40時間。10時間になるのはMTTR（60÷6）。"},{"y":2023,"n":8,"t":"ox","cat":"振動・破面解析","q":"設備の種類をいくつかに分類し、測定した振動があるレベルを超えた場合に異常と判断する方法を、絶対判定法という。","a":"○","e":"絶対判定法の説明どおり。ほかに相対判定法（同一設備の経時比較）、相互判定法（同一機種間の比較）がある。"},{"y":2023,"n":9,"t":"ox","cat":"保全管理","q":"保全方式の1つであるTBMの例として、クレーンの月例点検が挙げられる。","a":"○","e":"TBM（時間基準保全）は一定の周期で行う予防保全。月例点検はその代表例。"},{"y":2023,"n":10,"t":"ox","cat":"保全管理","q":"ある設備において、負荷時間200時間のうち、故障停止が3回で、故障停止時間はそれぞれ1.0時間、1.5時間、3.5時間であった。このときの故障度数率は、3.5％である。","a":"×","e":"故障度数率＝故障停止回数÷負荷時間×100＝3÷200×100＝1.5％。なお故障強度率は6÷200×100＝3％。"},{"y":2023,"n":11,"t":"ox","cat":"保全管理","q":"FMEAとは、構成要素の故障モードとその下位アイテムへの影響を解析する技法である。","a":"×","e":"FMEAは各構成要素の故障モードが上位アイテム（システム）へ及ぼす影響を解析するボトムアップ手法。"},{"y":2023,"n":12,"t":"ox","cat":"保全管理","q":"JISにおいて、機会損失費は、設備が劣化または故障しなかったならば得られていた利益である。","a":"○","e":"機会損失費（機会原価）の定義どおり。設備の劣化・故障により失われた利益をいう。"},{"y":2023,"n":13,"t":"ox","cat":"油圧・空気圧","q":"ポンプに発生したキャビテーション対策の1つとして、吸込揚程を大きくすることが挙げられる。","a":"×","e":"吸込揚程が大きいほど吸込圧力が下がりキャビテーションが起こりやすい。対策は吸込揚程を小さくすること。"},{"y":2023,"n":14,"t":"ox","cat":"品質管理","q":"調整型抜取検査では、前回までの検査成績を基に検査基準を調整する。","a":"○","e":"調整型抜取検査は過去の品質実績により、なみ検査・きつい検査・ゆるい検査へ切り替える方式。"},{"y":2023,"n":15,"t":"ox","cat":"品質管理","q":"ヒストグラムにおいて、下図に示す絶壁型は、規格外のものを選別して取り除いた場合などに発生する。","a":"○","e":"絶壁型（切れ落ち型）は、規格外品を全数選別して取り除いた場合や、測定・記録に作為がある場合に現れる。","fig":"2023_q15"},{"y":2023,"n":16,"t":"ox","cat":"品質管理","q":"ある製品の重量を測定した結果、7g、9g、10g、11g、13gの5個のデータが得られた。これらの製品の標準偏差は3gである。","a":"×","e":"平均10g、偏差−3,−1,0,+1,+3、二乗和20。20÷5＝4より標準偏差は2g。"},{"y":2023,"n":17,"t":"ox","cat":"品質管理","q":"np管理図を用いる例として、毎日生産量が違う工程における不適合品数の管理が挙げられる。","a":"×","e":"np管理図は群の大きさが一定のときに使う。生産量（群の大きさ）が変わる場合は不適合品率を扱うp管理図。"},{"y":2023,"n":18,"t":"ox","cat":"機械材料","q":"黄銅は、主成分がCuとNiの合金である。","a":"×","e":"黄銅（真ちゅう）はCu－Zn。Cu－Niは白銅。Cu－Snは青銅。"},{"y":2023,"n":19,"t":"ox","cat":"機械材料","q":"銅はアルミニウムより熱伝導率が低い。","a":"×","e":"熱伝導率は銅（約400W/(m･K)）＞アルミニウム（約236W/(m･K)）。銅の方が高い。"},{"y":2023,"n":20,"t":"ox","cat":"機械材料","q":"一般的に、高い硬度を必要とする材料に施す熱処理は、低温焼戻より、高温焼戻しの方が適している。","a":"×","e":"焼戻し温度が高いほど硬さは下がりじん性が増す。硬さを残すには低温焼戻し（150〜200℃程度）が適する。"},{"y":2023,"n":21,"t":"ox","cat":"安全衛生","q":"労働災害に関する指標の中で、度数率は、下記の式で求められる。\n（1年間の死傷者数÷1年間の平均労働者数）×1,000","a":"×","e":"この式は年千人率。度数率＝死傷者数÷延べ実労働時間数×1,000,000。"},{"y":2023,"n":22,"t":"ox","cat":"安全衛生","q":"KYT（危険予知訓練）の4ラウンド法において、4ラウンド目に行うのは、目標設定である。","a":"○","e":"1R現状把握 → 2R本質追究 → 3R対策樹立 → 4R目標設定。"},{"y":2023,"n":23,"t":"ox","cat":"安全衛生","q":"B火災を消火する方法の1つとして、強化液消火器で霧状放射することが挙げられる。","a":"○","e":"強化液は霧状放射することでB火災（油火災）にもC火災（電気火災）にも適用できる。棒状放射は普通火災（A火災）向け。"},{"y":2023,"n":24,"t":"ox","cat":"安全衛生","q":"SDS（安全データシート）は、設備で発生した災害の内容と、その対策を記録した資料である。","a":"×","e":"SDSは化学物質の危険有害性や取扱い・貯蔵上の注意、応急措置などを記載した文書。"},{"y":2023,"n":25,"t":"ox","cat":"安全衛生","q":"労働安全衛生法において、常時50人以上の労働者を使用する事業場では、1人以上の衛生管理者を選任しなければならないと定められている。","a":"○","e":"常時50人以上の労働者を使用する事業場では、規模に応じた人数（50〜200人では1人以上）の衛生管理者を選任する。"},{"y":2023,"n":26,"t":"mc","cat":"機械要素","q":"機械要素に関する記述のうち、適切なものはどれか。","a":"ア","e":"台形ねじは山の角度が30°で三角ねじ（60°）より小さく、摩擦力が小さいため送りねじに適する。イ：メカニカルシールの方が摩擦抵抗は小さい。ウ：やまば歯車はスラストが打ち消される。エ：並目のピッチは細目より大きい。","ch":["メートル台形ねじは、三角ねじよりも摩擦力が小さい。","メカニカルシールは、グランドパッキンと比べ、摺動面の摩擦抵抗が大きい。","やまば歯車は、軸方向の力が発生する。","呼び径が同じ場合、並目ねじは、細目ねじよりもピッチが小さい。"]},{"y":2023,"n":27,"t":"mc","cat":"機械要素","q":"機械要素に関する記述のうち、適切でないものはどれか。","a":"エ","e":"ブレーキトルク＝摩擦力×ドラム半径。直径が大きいほど腕の長さが増えるのでブレーキトルクは大きくなる。","ch":["オルダム軸継手は、固定軸継手と比べ、軸心のずれを許容できる。","電磁クラッチは、機械クラッチに比べ、連結時間が短い。","タイミングベルトは、平ベルトと比べ、初期張力が小さくてすむ。","ブレーキドラムの直径が大きいほど、ブレーキトルクは小さくなる。"]},{"y":2023,"n":28,"t":"mc","cat":"機械要素","q":"1組の平歯車において、モジュール5mm、中心距離160mm、速度伝達比3の場合、それぞれの歯車の歯数の組合せとして、適切なものはどれか。","a":"エ","e":"z₁+z₂＝2×160÷5＝64。伝達比3よりz₂＝3z₁。4z₁＝64、z₁＝16、z₂＝48。","ch":["12と32","12と36","16と32","16と48"]},{"y":2023,"n":29,"t":"mc","cat":"測定機器","q":"測定機器に関する記述のうち、適切なものはどれか。","a":"イ","e":"過大入力による計器の損傷を避けるため、最大レンジから始めて順次下げる。ア：容積式は粘度が高いほど漏れが少なく精度が良い。ウ：押し込むと長針は右回り。エ：触針式は高域の周波数特性が悪い。","ch":["容積式流量計は、測定する流体の粘度が低いほど測定精度が良くなる。","回路計（テスタ）を用いた電圧測定において、測定値が予測できないときは、最大の測定レンジから測定を始める。","ダイヤルゲージの長針は、プランジャ（スピンドル）を押し込むときに反時計回りに動く。","手持ちの触針式の振動センサは、マグネット式と比較して、高域帯の周波数を測定できる。"]},{"y":2023,"n":30,"t":"mc","cat":"測定機器","q":"硬さ試験に関する文中の（　）内に当てはまる語句として、適切なものはどれか。\n「（　）硬さ試験とは、ダイヤモンドハンマを一定の高さから落下させ、その跳ね上がり高さを測定することで、硬さを測定する試験方法である。」","a":"エ","e":"ショア硬さ試験は反発（跳ね上がり）高さから硬さを求める方法で、圧痕がほとんど残らず現場での測定に向く。","ch":["ブリネル","ビッカース","ロックウェル","ショア"]},{"y":2023,"n":31,"t":"mc","cat":"振動・破面解析","q":"破面解析に関する記述のうち、適切でないものはどれか。","a":"イ","e":"へき開面に沿って形成され、腐食環境や亀裂進展の速い場合に現れるのは脆性ストライエーション。","ch":["ストライエーションは、繰り返し荷重の1サイクルごとに形成される縞模様のことをいう。","延性ストライエーションは、へき開面に沿って形成され、腐食性雰囲気での疲労破面や亀裂進展速度が速い場合などに観察される。","ディンプル模様の破面は、延性破壊が起きたと推定される。","フラクトグラフィとは、破断面の破壊の状態を観察・解析することをいう。"]},{"y":2023,"n":32,"t":"mc","cat":"溶接・非破壊検査","q":"溶接の不具合と対策に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"オーバラップは溶接電流が大きすぎる・溶接速度が遅いことが主な原因。対策は電流を下げること。増やすと悪化する。","ch":["ピットの対策の1つとして、アーク長を短くすることが挙げられる。","ブローホールの対策の1つとして、母材の水分を除去することが挙げられる。","オーバーラップの対策の1つとして、溶接電流を増すことが挙げられる。","アンダーカットの対策の1つとして、溶接速度の低減が挙げられる。"]},{"y":2023,"n":33,"t":"mc","cat":"潤滑","q":"給油方式に関する文中の（　）内に当てはまる語句として、適切なものはどれか。\n「（　）潤滑は、高速回転の転がり軸受に適用可能であり、油を反復式で給油する方式である。」","a":"イ","e":"油浴潤滑は油だめの油を繰り返し使う反復式。滴下・灯心・噴霧は使い切りの全損失（消費）式。","ch":["滴下","油浴","灯心","噴霧"]},{"y":2023,"n":34,"t":"mc","cat":"潤滑","q":"グリースに関する記述のうち、適切なものはどれか。","a":"ア","e":"グラファイト（黒鉛）は固体潤滑剤で、耐摩耗性・耐焼付性に優れる。イ：ナトリウムグリースは水に溶けやすく耐水性が悪い。ウ：リチウムグリースは耐水性・耐熱性ともに良く汎用性が高い。エ：シリコングリースは耐熱性は良いが耐圧（耐荷重）性が低い。","ch":["グラファイト系グリースは、耐摩耗性に優れている。","ナトリウムグリースは、耐水性がよいが、極圧性、潤滑性が悪い。","リチウムグリースは、耐水性はよいが、耐熱性が悪い。","シリコングリースは、耐熱性、耐圧性が優れている。"]},{"y":2023,"n":35,"t":"mc","cat":"潤滑","q":"潤滑油の汚染度分析法に関する記述のうち、適切でないものはどれか。","a":"エ","e":"フェログラフィ法は磁力で摩耗粒子を分離・観察する方法で、10μm以上の大きな粒子も分析できる。むしろ大きな粒子の観察に適し、微小粒子（数μm以下）が中心のSOAP法と補完関係にある。","ch":["分析フェログラフィ法は、フェロスコープで摩耗粒子の大きさや形状、色などを観察し、機械の損傷原因と程度を判定するものである。","SOAP法は、潤滑油中の摩耗粉を分光分析し、金属元素成分とその濃度を測定して損傷箇所を推定する方法である。","定量フェログラフィ法は、総摩耗粒子量と異常摩耗粒子量の値を傾向管理することで、機械の潤滑状態や損傷状態を診断するものである。","フェログラフィ法は、10μm以上の摩耗粒子は、分析できない。"]},{"y":2023,"n":36,"t":"mc","cat":"機械工作法","q":"機械工作法に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"光沢のある鏡面に仕上がるのは乾式ラッピング。湿式は能率が高い反面、つや消し状の面になる。","ch":["レーザ加工は、ワイヤ放電加工に比べ、加工速度が速い。","電解研磨は、化学研磨に比べ、小物を大量に処理することが困難である。","湿式ラッピングは、乾式ラッピングに比べ、表面が光沢のある鏡面に仕上がる。","フライス加工における下向き削りは、上向き削りに比べ、刃先が摩耗しにくい。"]},{"y":2023,"n":37,"t":"mc","cat":"機械工作法","q":"機械工作法に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"ねじの製造は、まず圧造で頭部などの形をつくり、そののちに転造でねじ山を成形する。順序が逆。","ch":["ダイカスト鋳造法は、精密に仕上げた金型に溶湯を圧入して鋳物を生成する方法である。","ロストワックス鋳造法は、ろうなどの高温で溶ける素材で原型を作り、その周りに流動状の鋳型材を流し、素材を溶かすことで鋳型を製作する方法である。","ねじは、線材を転造したのちに、圧造してつくられる。","冷間鍛造は熱間鍛造と比べ、成形に大きな力が必要となる。"]},{"y":2023,"n":38,"t":"mc","cat":"溶接・非破壊検査","q":"溶接に関する記述のうち、適切なものはどれか。","a":"エ","e":"スパッタは溶接中に飛散する金属粒。ア：フラックスは溶接棒の被覆剤で、金属線は心線。イ：溶接ヒュームは金属蒸気が凝固した微粒子で人体に有害。ウ：金属が蒸気となったものはヒュームで、スラグはフラックスが溶けてできる非金属物質。","ch":["フラックスは、被覆アーク溶接に用いる溶接棒の金属線である。","溶接ヒュームは、溶接金属の酸化や窒化を防ぐ効果がある。","スラグは、アークの熱によって溶けた金属が蒸気となったものである。","スパッタは、溶接中に飛散する金属粒などのことである。"]},{"y":2023,"n":39,"t":"mc","cat":"溶接・非破壊検査","q":"磁粉探傷試験に関する文中の（　）内に当てはまる語句として、適切なものはどれか。\n「（　）とは、試験体または試験体の一部を電磁石の磁極に接して設置し、電磁石によって発生した磁束を試験体の中に投入して磁化する方法である。」","a":"ア","e":"極間法は電磁石（ヨーク）の磁極を試験体に当てて磁化する方法。コイル法は試験体をコイル内に置き、プロッド法は電極を当てて電流を流し、電流貫通法は貫通導体に電流を流して磁化する。","ch":["極間法","コイル法","プロッド法","電流貫通法"]},{"y":2023,"n":40,"t":"mc","cat":"油圧・空気圧","q":"油圧機器に関する記述のうち、適切でないものはどれか。","a":"ア","e":"設定圧力以上になると油を逃がすのはリリーフ弁。カウンタバランス弁は戻り側に背圧を与えて自重落下を防ぐ弁。","ch":["カウンタバランス弁は、回路内の圧力が設定圧力以上になると自動的に油圧を逃がす。","一般的に、減圧弁のドレンポートに必要以上の背圧がかかると、二次側の圧力は上昇する。","カットオフとは、ポンプ出口側圧力が設定圧力に近づいたとき、可変吐出し量制御が働いて、流量を減少させることである。","デセラレーション弁は、アクチュエータの加速や減速に用いられる。"]},{"y":2023,"n":41,"t":"mc","cat":"油圧・空気圧","q":"油圧・空気圧機器に関する記述のうち、適切なものはどれか。","a":"ア","e":"クローズドセンタ形は中立位置で全ポートを閉じるため、シリンダを任意の位置で保持・停止できる。イ：電流が位置に関係なく一定なのは直流ソレノイド。ウ：焼損しやすいのは交流ソレノイド。エ：変動負荷での安定した速度制御にはメータアウト回路が適する。","ch":["複動シリンダを任意の位置で停止させる場合、5ポート3位置クローズドセンタ形電磁弁が適している。","交流ソレノイドは、プランジャの位置に関係なくコイルを流れる電流は一定である。","直流ソレノイドは、交流ソレノイドと比較し、ソレノイドコイルの焼損が発生しやすい。","メータイン回路は、メータアウト回路と比べ、変動する負荷に対して安定した速度で制御する場合に適している。"]},{"y":2023,"n":42,"t":"mc","cat":"油圧・空気圧","q":"油圧装置および空気圧装置の異常時における対応に関する記述のうち、適切なものはどれか。","a":"イ","e":"ルブリケータの潤滑油にはタービン油（ISO VG32程度）が適する。ア：ゴムホースは適度なたるみをもたせる。ウ：排気ポートからの漏れはピストンパッキンの不良を疑う。エ：オーバライドを大きくしてもチャタリングの対策にはならない。","ch":["油圧装置において直線的に使用していたゴムホースが破損したため、新しいゴムホースをたるみがないよう張って取り付けた。","ルブリケータ内の潤滑油が少なかったので、タービン油を足した。","方向制御弁の排気ポート側から空気漏れがあったので、空気圧シリンダのロッドパッキンを点検した。","チャタリングが発生したので、パイロット作動形リリーフ弁のオーバーライドを大きくした。"]},{"y":2023,"n":43,"t":"mc","cat":"油圧・空気圧","q":"作動油に関する記述のうち、適切でないものはどれか。","a":"イ","e":"ウレタンゴムは水分で加水分解するため、水を含む水-グリコール系作動油には使用できない。","ch":["ジエステル油は、ブチルゴムパッキンに使用できない。","水-グリコール系作動油は、ウレタンゴムパッキンに使用できる。","リン酸エステル系作動油は、ニトリルゴムパッキンに使用できない。","塩素化炭化水素作動油は、ふっ素ゴムパッキンに使用できる。"]},{"y":2023,"n":44,"t":"mc","cat":"機械材料","q":"非金属材料に関する記述のうち、適切でないものはどれか。","a":"イ","e":"ポリエチレンは熱可塑性だが軟化点が低く、耐熱性に乏しい。","ch":["エポキシ樹脂は、熱硬化性であり、常温・常圧で成形できる。","ポリエチレンは、熱可塑性であり、耐熱性に優れる。","ポリプロピレン樹脂は、ABS樹脂に比べ、耐薬品性に優れる。","結晶性合成樹脂は、非結晶性合成樹脂と比べ、成形収縮率が大きい。"]},{"y":2023,"n":45,"t":"mc","cat":"機械材料","q":"金属材料の表面処理に関する記述のうち、適切でないものはどれか。","a":"エ","e":"クロメート処理は亜鉛めっき皮膜の上にクロム酸皮膜をつくり耐食性を高める処理。硬度を高めるものではない。","ch":["浸炭は、主に低炭素の鋼に使用される。","焼入れと焼戻しは、浸炭処理後に行う。","SPCCやS15Cに浸炭窒化処理を行うと、硬度が上がる。","めっき後、クロメート処理を行うと硬度が増す。"]},{"y":2023,"n":46,"t":"mc","cat":"材料力学","q":"下図において、鋳鉄製の直方体を2本の玉掛け用ワイヤロープを用いてつり角度60°で吊る場合、1本のワイヤロープにかかる張力として、もっとも近い数値はどれか。ただし、鋳鉄製の直方体の質量は3.6t、張力係数は1.16、重力の加速度は9.8m/s²とする。また、荷の前後左右のつり合いは取れており、左右のワイヤロープの張力は同じとし、ワイヤロープおよび荷のつり金具の質量は考えないものとする。","a":"イ","e":"荷重＝3.6×1,000×9.8＝35,280N≒35.3kN。2本で分担するので1本あたり17.6kN、これに張力係数1.16を掛けて約20.5kN。もっとも近いのは20kN。","ch":["18kN","20kN","25kN","35kN"],"fig":"2023_q46"},{"y":2023,"n":47,"t":"mc","cat":"材料力学","q":"材料力学に関する記述のうち、適切なものはどれか。","a":"エ","e":"伸び＝5,000mm×0.001＝5mm。ア：1,600÷40＝40N/mm²。イ：反力はそれぞれ250N。ウ：安全率＝570÷190＝3。","ch":["断面積40mm²の丸棒に、1,600Nの引張荷重が働いているときの引張応力は64N/mm²である。","両端支持ばりで、中央に500Nの集中荷重が作用して、釣り合っているときの2つの支点の反力はそれぞれ500Nである。","機械構造用炭素鋼鋼材の基準強さが570MPaのとき、許容応力を190MPaとすると、安全率は5となる。","長さ5mの丸棒を引っ張ったときの縦ひずみが0.1％の場合、伸びは5mmである。"]},{"y":2023,"n":48,"t":"mc","cat":"材料力学","q":"下図の応力－ひずみ線図に関する記述のうち、適切でないものはどれか。","a":"ア","e":"A点が比例限度、B点が弾性限度、C点が上降伏点、D点が下降伏点。弾性変形から塑性変形へ移行する降伏点はC点で、B点は弾性限度。","ch":["B点を降伏点といい、弾性変形から塑性変形に移行する点である。","線①を公称応力－ひずみ図といい、線②を真応力－ひずみ図という。","E点を引張強さといい、F点を破断点という。","D点を下降伏点といい、応力が増加せずひずみが急に増加しはじめる点である。"],"fig":"2023_q48"},{"y":2023,"n":49,"t":"mc","cat":"機械材料","q":"材料記号に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"SS400の400は最低引張強さ400N/mm²を表す。炭素含有量ではない。","ch":["SPCのC記号は、冷間を表している。","S45CのC記号は、炭素を表している。","SS400の400は、炭素含有量が0.4％を表している。","S45Cの45は、炭素含有量が0.45％を表している。"]},{"y":2023,"n":50,"t":"mc","cat":"製図","q":"JISにおいて、製図方法の寸法線および寸法補助線の記入方法として、適切でないものはどれか。","a":"エ","e":"ア・イは円弧の長さの寸法で、寸法線を円弧と同心の円弧で表しており正しい。ウは弦の長さの寸法で、寸法線を弦に平行な直線とし、寸法補助線を弦に直角（垂直）に引いており正しい。エは寸法線が直線（弦の長さ）であるにもかかわらず、寸法補助線を放射状（斜め）に引いているため、寸法線と寸法補助線の関係が正しくない。","ch":["ア（図参照）","イ（図参照）","ウ（図参照）","エ（図参照）"],"fig":"2023_q50"},{"y":2024,"n":1,"t":"ox","cat":"機械工作法","q":"一般的に、流れ型切りくずが発生する加工面より、むしれ型切りくずが発生する加工面は粗くなる。","a":"○","e":"流れ型は連続的にスムーズに削れるため仕上面がよい。むしれ型は材料がむしり取られるように分離するため加工面は粗くなる。"},{"y":2024,"n":2,"t":"ox","cat":"工作機械・FA","q":"FAにおけるオートローダとは、工作機械などに、工作物を自動的に取付け、取外しをする装置である。","a":"○","e":"オートローダの定義どおり。部品を整列して送り出すのはパーツフィーダ。"},{"y":2024,"n":3,"t":"ox","cat":"電気・電子","q":"下図に示す回路において、抵抗①に流れる電流は、1Aである。","a":"○","e":"2Ω・5Ω・10Ωの並列合成は1/(1/2+1/5+1/10)＝1.25Ω。全電流4Aなので端子電圧は4×1.25＝5V。①（5Ω）の電流は5÷5＝1A。","fig":"2024_q3"},{"y":2024,"n":4,"t":"ox","cat":"電気・電子","q":"三相誘導電動機の二次抵抗が増加した場合、最大トルクは減少する。","a":"×","e":"比例推移により、二次抵抗を増やしても最大トルクの大きさは変わらず、最大トルクを生じるすべりが大きくなる（始動トルクが増す）。"},{"y":2024,"n":5,"t":"ox","cat":"電気・電子","q":"下図に示す回路は、自己保持回路を形成している。","a":"×","e":"自己保持回路は、始動用押しボタンBS2（a接点）と並列に電磁接触器MCの“a接点”を入れる。図では並列に入っているMCの接点がb接点なので、MCが励磁されるとその接点が開いてしまい自己保持できない。","fig":"2024_q5"},{"y":2024,"n":6,"t":"ox","cat":"保全管理","q":"正味稼働率が60％、時間稼働率が80％、速度稼働率が65％のとき、性能稼働率は39％である。","a":"○","e":"性能稼働率＝正味稼働率×速度稼働率＝0.60×0.65＝0.39＝39％。時間稼働率は性能稼働率の計算には使わない。"},{"y":2024,"n":7,"t":"ox","cat":"保全管理","q":"ある設備において、設備の稼働時間の合計が200時間、故障停止回数が4回、故障の修復にかかった時間の合計が80時間であった。このときのMTTRは10時間である。","a":"×","e":"MTTR＝修復時間の合計÷故障回数＝80÷4＝20時間。なおMTBFは200÷4＝50時間。"},{"y":2024,"n":8,"t":"ox","cat":"保全管理","q":"TPMは、生産システム効率化の極限追求（総合的効率化）をする企業の体質づくりを目標にしている。","a":"○","e":"TPMの定義の第一項。災害ゼロ・不良ゼロ・故障ゼロを目指す全員参加の生産保全。"},{"y":2024,"n":9,"t":"ox","cat":"保全管理","q":"故障の解析の手法としてFMEAを適用する場合、下位から上位の故障モードへ解析をすすめていく。","a":"○","e":"FMEAは部品などの下位アイテムの故障モードから、上位システムへの影響を積み上げて評価するボトムアップ手法。"},{"y":2024,"n":10,"t":"ox","cat":"保全管理","q":"ある設備において、負荷時間100時間のうち、故障停止が3回で故障停止時間はそれぞれ1.0時間、2.0時間、4.0時間であった。このときの故障度数率は、3％である。","a":"○","e":"故障度数率＝故障停止回数÷負荷時間×100＝3÷100×100＝3％。故障強度率は7÷100×100＝7％。"},{"y":2024,"n":11,"t":"ox","cat":"保全管理","q":"寿命特性曲線における摩耗故障期では、部品交換などの故障対策を行うことで、上昇する故障率を下げることができる。","a":"○","e":"摩耗故障期は劣化により故障率が上昇する期間で、寿命に達した部品の交換・オーバホールなどの予防保全が有効。"},{"y":2024,"n":12,"t":"ox","cat":"保全管理","q":"JISにおいて、機会損失費は、設備が劣化または故障しなかったならば得られていた利益である。","a":"○","e":"機会損失費の定義どおり。"},{"y":2024,"n":13,"t":"ox","cat":"油圧・空気圧","q":"ポンプに発生したキャビテーション対策の1つとして、吸込揚程を小さくすることが挙げられる。","a":"○","e":"吸込揚程を小さくすると吸込側の圧力低下が抑えられ、キャビテーションが起こりにくくなる。"},{"y":2024,"n":14,"t":"ox","cat":"品質管理","q":"調整型抜取検査では、合格となったロットはそのまま受け入れられるが、不合格となったロットは全数選別の処置をとる。","a":"×","e":"この説明は選別型抜取検査。調整型抜取検査は過去の検査成績によりなみ・きつい・ゆるい検査へ切り替える方式。"},{"y":2024,"n":15,"t":"ox","cat":"品質管理","q":"ヒストグラムにおいて、下図に示す絶壁型は、ヒストグラムを描くときの区間分けがよくない場合などに発生する。","a":"×","e":"絶壁型は規格外品を選別して取り除いた場合などに現れる。区間分けが適切でないときに現れるのは歯抜け型（くし型）。","fig":"2024_q15"},{"y":2024,"n":16,"t":"ox","cat":"品質管理","q":"ある製品の重量を測定した結果、7g、9g、10g、11g、13gの5個のデータが得られた。これらの製品の標準偏差は2gである。","a":"○","e":"平均10g、偏差−3,−1,0,+1,+3、二乗和20。20÷5＝4、√4＝2g。"},{"y":2024,"n":17,"t":"ox","cat":"品質管理","q":"c管理図を用いる例として、それぞれの面積が異なるアルミ板を生産している工程の、表面上の傷の発生状況の管理が挙げられる。","a":"×","e":"c管理図は単位（大きさ）が一定の場合に用いる。面積が異なる場合は単位あたりの欠点数を扱うu管理図。"},{"y":2024,"n":18,"t":"ox","cat":"機械材料","q":"SUS304は、SUS410に比べ、防錆性が高い。","a":"○","e":"SUS304はCr18％・Ni8％のオーステナイト系、SUS410はCr13％程度のマルテンサイト系。Cr・Niが多いSUS304の方が耐食性・防錆性が高い。"},{"y":2024,"n":19,"t":"ox","cat":"機械材料","q":"一般的に、SS400は、熱処理を行い硬度を向上させてから使用する。","a":"×","e":"SS400は一般構造用圧延鋼材で炭素量が規定されておらず、焼入れによる硬化は期待できない。通常は熱処理せず使用する。"},{"y":2024,"n":20,"t":"ox","cat":"機械材料","q":"一般的に、高い硬度を必要とする材料に施す熱処理は、高温焼戻より、低温焼戻しの方が適している。","a":"○","e":"焼戻し温度が高いほど硬さは低下しじん性が増す。硬さを重視する場合は低温焼戻し。"},{"y":2024,"n":21,"t":"ox","cat":"安全衛生","q":"労働災害に関する指標の中で、強度率は、下記の式で求められる。\n（延べ労働損失日数÷延べ実労働時間数）×1,000","a":"○","e":"強度率の定義式どおり。災害の重さ（損失日数）を表す指標。度数率は死傷者数÷延べ実労働時間数×1,000,000。"},{"y":2024,"n":22,"t":"ox","cat":"安全衛生","q":"KYT（危険予知訓練）の4ラウンド法において、4ラウンド目に行うのは、対策樹立である。","a":"×","e":"4ラウンド目は目標設定。対策樹立は3ラウンド目。"},{"y":2024,"n":23,"t":"ox","cat":"安全衛生","q":"電気火災を消火する方法の1つとして、強化液消火器で霧状放射することが挙げられる。","a":"○","e":"強化液は霧状放射すれば電気火災（C火災）にも使える。棒状放射は感電のおそれがあり不可。"},{"y":2024,"n":24,"t":"ox","cat":"安全衛生","q":"フェイルセーフ設計の例として、回転物への巻き込まれ防止のカバーが挙げられる。","a":"×","e":"カバーは危険源を隔離するガード。フェイルセーフは故障・異常が起きても安全側に働くようにする設計。"},{"y":2024,"n":25,"t":"ox","cat":"安全衛生","q":"労働安全衛生法において、常時500人以上の労働者を使用する事業場では、専任の衛生管理者が必要であると定められている。","a":"×","e":"専任の衛生管理者が必要なのは、常時1,000人を超える事業場、または常時500人を超える事業場で坑内労働・一定の有害業務に常時30人以上が従事する場合。"},{"y":2024,"n":26,"t":"mc","cat":"機械要素","q":"機械要素に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"呼び径が同じなら、並目ねじのピッチは細目ねじより大きい。細目は同じ呼び径でピッチを細かくしたねじで、緩みにくく微調整に向く。","ch":["ボールねじは、静摩擦係数と動摩擦係数の差が小さく、スティックスリップを生じにくい。","ボールねじは、予圧を与えることにより、バックラッシを低減し、剛性を高めることができる。","呼び径が同じ場合、並目ねじは、細目ねじよりもピッチが小さい。","メートル台形ねじは、三角ねじよりも摩擦力が小さい。"]},{"y":2024,"n":27,"t":"mc","cat":"機械要素","q":"機械要素に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"かみ合い（つめ）クラッチは、つめや歯のかみ合いによって動力を伝える。押し付け力による摩擦で伝達するのは摩擦クラッチ。","ch":["タイミングベルトは、平ベルトと比べ、初期張力が小さくてすむ。","オルダム軸継手は、大きな動力伝達や高速回転に適していない。","かみ合いクラッチは、軸方向に押し付ける力によって生じる摩擦力を利用して動力を伝達する。","電磁クラッチは、機械クラッチに比べ、連結時間が短い。"]},{"y":2024,"n":28,"t":"mc","cat":"機械要素","q":"クレーン用ワイヤロープに関する記述のうち、適切でないものはどれか。","a":"イ","e":"玉掛用ワイヤロープの安全係数はクレーン等安全規則で6以上と定められている（クレーンのつり上げ用ワイヤロープは5以上）。","ch":["ワイヤロープの1撚りの間において、フィラ線を除く素線の数が10％以上切断している場合は、使用してはならない。","玉掛用のワイヤロープの安全係数は、5以上と定められている。","ワイヤロープの直径が公称径に対して7％を超えて減少している場合には、使用してはならない。","ワイヤロープの直径は、外接円の直径のうち2箇所以上を測定し、その平均値をとる。"]},{"y":2024,"n":29,"t":"mc","cat":"測定機器","q":"測定機器に関する記述のうち、適切でないものはどれか。","a":"イ","e":"容積式流量計は計量室と回転子のすきまから漏れる量が誤差になるため、粘度が高い流体ほど漏れが少なく精度が良い。粘度が低いほど精度が良くなるわけではない。","ch":["面積式流量計は、流量計前後に直管部を設ける必要がない。","容積式流量計は、測定する流体の粘度が低いほど測定精度が良くなる。","電磁流量計は、測定する流体の圧力や粘度の影響を受けない。","差圧式流量計は、水や油だけでなく、ガスや蒸気の流量も測定できる。"]},{"y":2024,"n":30,"t":"mc","cat":"振動・破面解析","q":"振動および振動計に関する記述のうち、適切なものはどれか。","a":"エ","e":"アンバランスは回転周波数（1,500÷60＝25Hz）に現れる低〜中周波の振動なので速度モードが有効。ア：高周波まで測れるのは圧電型加速度センサ。イ：触針式は高域の特性が悪い。ウ：1,200min⁻¹＝1,200÷60＝20Hz。","ch":["動電型速度センサは、圧電型加速度センサに比べ、高い周波数まで測定可能である。","手持ちの触針式のセンサは、マグネット式と比較して、高域帯の周波数特性に有効である。","1,200min⁻¹で回転している軸の回転周波数は1,200Hzである。","1,500min⁻¹で回転する送風機のアンバランスを振動測定で検知するには、速度測定モードが有効である。"]},{"y":2024,"n":31,"t":"mc","cat":"振動・破面解析","q":"破面解析に関する記述のうち、適切でないものはどれか。","a":"ア","e":"疲労破壊は弾性限度以下の応力でも、繰返し数が多ければ発生する。これが疲労限度（S-N曲線）を考える理由。","ch":["疲労破壊は、作用する繰返し応力が弾性限度以下では発生しない。","フラクトグラフィとは、破断面の破壊の状態を観察・解析することをいう。","ディンプル模様の破面は、延性破壊が推定される。","シェブロンパターンは、山形の模様があり脆性破壊が推定される。"]},{"y":2024,"n":32,"t":"mc","cat":"振動・破面解析","q":"機械に生じる現象と、その影響で発生した振動の測定パラメータの組合せとして、適切でないものはどれか。","a":"ア","e":"ミスアライメントは回転数の1〜2倍程度の低い周波数で現れるため、変位または速度で測る。加速度は高周波成分（キャビテーション、軸受の傷など）の検出に適する。","ch":["現象名：ミスアライメント　測定パラメータ：加速度","現象名：キャビテーション　測定パラメータ：加速度","現象名：アンバランス　測定パラメータ：変位","現象名：軸の曲がり　測定パラメータ：変位"]},{"y":2024,"n":33,"t":"mc","cat":"潤滑","q":"潤滑油の試験項目に関する記述のうち、適切でないものはどれか。","a":"エ","e":"動粘度は、粘度をその液体の同一状態（温度・圧力）における密度で除した商。異なる温度での粘度の比ではない。","ch":["酸価とは、試料1g中に含まれる酸性成分を中和するのに要する水酸化カリウムのmg数のことである。","流動点とは、試料を45℃に加熱した後、かき混ぜないで規定の方法で冷却したとき、試料が流動する最低温度のことである。","引火点とは、規定条件下で引火源を試料蒸気に近づけたとき、試料蒸気が閃光を発して瞬間的に燃焼し、かつその炎が液面上を伝播する試料の最低温度を101.3kPaの値に気圧補正した温度のことである。","動粘度とは、同一圧力において、その液体が0℃のときの粘度と、20℃のときの粘度の比のことである。"]},{"y":2024,"n":34,"t":"mc","cat":"潤滑","q":"潤滑に関する記述のうち、適切でないものはどれか。","a":"エ","e":"ナトリウムグリースは水に溶けやすく耐水性が悪い。一方で極圧性・潤滑性や耐熱性は比較的良い。","ch":["グラファイト系グリースは、耐焼付性に優れている。","リチウムグリースは、耐水性、耐熱性に優れている。","シリコングリースは、耐熱性は良いが、耐圧性が悪い。","ナトリウムグリースは、耐水性はよいが、極圧性、潤滑性が悪い。"]},{"y":2024,"n":35,"t":"mc","cat":"潤滑","q":"潤滑油の汚染度分析法に関する記述のうち、適切なものはどれか。","a":"ウ","e":"SOAP法（Spectrometric Oil Analysis Program）は油中の摩耗粉を分光分析し、金属元素とその濃度から損傷箇所を推定する。ア：濾過して顕微鏡観察するのはメンブレンフィルタ法。イ：分光分析で元素を測るのはSOAP法。エ：フェログラフィ法は大きな粒子も分析できる。","ch":["定量フェログラフィ法は、潤滑油100mlを濾過し、乾燥後コンタミナントを顕微鏡で観察するものである。","分析フェログラフィ法は、潤滑油中の微細固形物を分光分析することにより、元素ごとに含有量を計測するものである。","SOAP法は、潤滑油中の摩耗粉を分光分析し、金属元素成分とその濃度を測定して損傷箇所を推定する方法である。","フェログラフィ法は、10μm以上の摩耗粒子は、分析できない。"]},{"y":2024,"n":36,"t":"mc","cat":"機械工作法","q":"機械工作法に関する記述のうち、適切でないものはどれか。","a":"イ","e":"通電して表面を溶解するのは電解研磨。化学研磨は通電せず、薬品中に浸すだけで表面を溶解・平滑化する。","ch":["レーザ加工は、ワイヤ放電加工に比べ、加工速度が速い。","化学研磨は、金属を化学薬品中に浸し、通電することで金属の表面を磨くものである。","フライス加工における下向き削りは、上向き削りに比べ、刃先が摩耗しにくい。","乾式ラッピングは、湿式ラッピングに比べ、表面が光沢のある鏡面に仕上がる。"]},{"y":2024,"n":37,"t":"mc","cat":"機械工作法","q":"機械工作法に関する記述のうち、適切なものはどれか。","a":"ア","e":"熱間鍛造は再結晶温度以上で行うため加工硬化してもすぐ再結晶して軟化し、大きな変形ができる。イ：圧造ののちに転造する。ウ：フィルムと真空吸引を使うのはＶプロセス（真空造型法）。エ：再結晶が起こる温度は再結晶温度。","ch":["熱間鍛造では、鍛造されることで結晶が変形し硬化するが、すぐに再結晶化して軟化する。","ねじは、線材を転造したのちに、圧造してつくられる。","ロストワックス鋳造法は、鋳物砂を薄いプラスチックフィルムで覆い、砂中を真空吸引し、鋳物の形状を保持する方法である。","変形を加えた金属を加熱した時に、再結晶が起こる温度を鍛造温度という。"]},{"y":2024,"n":38,"t":"mc","cat":"溶接・非破壊検査","q":"溶接に関する記述のうち、適切なものはどれか。","a":"イ","e":"アンダカットは止端に沿って母材が掘られ、溶着金属で満たされずに残る溝。ア：表面に開口した気孔はピットで、ブローホールは内部に残った気孔。ウ：金属が蒸気になったものはヒューム。スラグはフラックスが溶けた非金属物質。エ：高温で生じる割れは高温割れ。","ch":["ブローホールは、溶接金属中に発生した気泡が、溶接部の表面に達し開口した気孔である。","アンダーカットは、母材または既溶接の上に溶接して生じた止端の溝である。","スラグは、アークの熱によって溶けた金属が蒸気となったものである。","溶接ヒュームは、溶接直後の高温状態で溶接部に発生するひび割れのことである。"]},{"y":2024,"n":39,"t":"mc","cat":"溶接・非破壊検査","q":"浸透探傷試験に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"乾燥処理は洗浄処理後の試験体表面の水分を乾燥させる作業（または湿式現像後の乾燥）。浸透液そのものを乾燥させるわけではない。浸透液を乾かすと傷から浸透液がにじみ出ず、指示模様が得られない。","ch":["前処理とは、浸透処理の前に汚れなどを取り除く処理のことである。","浸透処理には、浸透液に試験体を浸漬する、スプレーで浸透液を塗布するなどの方法がある。","乾燥処理とは、試験体表面の浸透液を乾燥させる作業である。","洗浄処理とは、傷以外の表面の余分な浸透液を水洗い等で洗い流す作業である。"]},{"y":2024,"n":41,"t":"mc","cat":"油圧・空気圧","q":"油圧・空気圧機器に関する記述のうち、適切なものはどれか。","a":"ア","e":"温度が上がるとコイルの抵抗が増えて電流が減り、吸引力は低下する。イ：戻り側に背圧を与えるのはカウンタバランス弁。ウ：焼損しやすいのは交流ソレノイド。エ：変動負荷での安定した速度制御にはメータアウト回路が適する。","ch":["交流ソレノイドは、周囲の温度が上昇すると、吸引力が減少する。","アンロード弁は、アクチュエータの戻り側に抵抗を与え、自重落下を防止するときに使用する。","直流ソレノイドは、交流ソレノイドと比較し、ソレノイドコイルの焼損が発生しやすい。","メータイン回路は、メータアウト回路と比べ、変動する負荷に対して安定した速度で制御する場合に適している。"]},{"y":2024,"n":42,"t":"mc","cat":"油圧・空気圧","q":"油圧・空気圧機器の異常に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"オーバライド（設定圧力とクラッキング圧力の差）を大きくしてもチャタリングは解消しない。チャタリングは弁体の振動によるもので、ベント配管の適正化や弁の選定・減衰の付与などで対処する。","ch":["油圧ポンプから異常音が発生したときの対策の1つとして、作動油の粘度を下げることが挙げられる。","油圧シリンダの速度が低下したときの対策の1つとして、油圧ポンプの容積効率を向上させることが挙げられる。","パイロット作動形リリーフ弁にチャタリングが発生したときの対策の1つとして、オーバーライドを大きくすることが挙げられる。","油圧シリンダにスティックスリップが発生したときの対策の1つとして、油圧シリンダの速度を速くすることが挙げられる。"]},{"y":2024,"n":43,"t":"mc","cat":"油圧・空気圧","q":"作動油に関する記述のうち、適切でないものはどれか。","a":"エ","e":"リン酸エステル系作動油はニトリルゴムを侵すが、シリコンゴムやふっ素ゴム、ブチルゴムには使用できる。","ch":["水-グリコール系作動油は、ニトリルゴムパッキンに使用できる。","リン酸エステル系作動油は、ニトリルゴムパッキンに使用できない。","塩素化炭化水素作動油は、ふっ素ゴムパッキンに使用できる。","リン酸エステル系作動油は、シリコンゴムパッキンに使用できない。"]},{"y":2024,"n":44,"t":"mc","cat":"機械材料","q":"非金属材料に関する記述のうち、適切なものはどれか。","a":"ウ","e":"エポキシ樹脂は熱硬化性で、常温・常圧で硬化・成形できるのが特徴。ア：ポリ塩化ビニルは熱可塑性。イ：フェノール樹脂は熱硬化性。エ：熱硬化性のメラミン樹脂の方が熱可塑性のポリプロピレンより硬い。","ch":["ポリ塩化ビニルは、熱硬化性であり、燃えにくく、水や電気を通さない。","フェノール樹脂は、熱可塑性であり、ベークライトともよばれ、耐熱性がある。","エポキシ樹脂は、熱硬化性であり、常温・常圧で成形できる。","メラミン樹脂は、ポリプロピレン樹脂と比べ、硬度が低い。"]},{"y":2024,"n":45,"t":"mc","cat":"機械材料","q":"金属の表面処理に関する記述のうち、適切なものはどれか。","a":"ア","e":"S15Cは低炭素鋼で、浸炭窒化処理により表面に炭素と窒素をしみ込ませ硬化できる。イ：光沢ニッケルめっきの方が硬い。ウ：耐食性は有色クロメートの方が優れる。エ：浸炭は表面だけを硬化させる処理。","ch":["S15Cに浸炭窒化処理を行うと、硬度が上がる。","無光沢ニッケルめっきは、光沢ニッケルめっきと比べ、硬度に優れる。","光沢クロメートは、有色クロメートより耐食性に優れる。","浸炭を行うと、表面層と内部の硬さを均一にすることができる。"]},{"y":2024,"n":46,"t":"mc","cat":"材料力学","q":"下図において、組合せ滑車を用いて質量350kgの荷を吊るとき、これを支えるために必要な力Fとして、もっとも近い数値はどれか。ただし、重力の加速度は9.8m/s²とし、滑車およびワイヤロープの質量、摩擦は考えないものとする。","a":"ウ","e":"荷重＝350×9.8＝3,430N。図の組合せ滑車では荷を支えるロープが8本になるため、F＝3,430÷8≒429N。","ch":["181N","324N","429N","511N"],"fig":"2024_q46"},{"y":2024,"n":47,"t":"mc","cat":"材料力学","q":"材料力学に関する記述のうち、適切でないものはどれか。","a":"エ","e":"安全率＝基準強さ÷許容応力＝570÷190＝3。5ではない。","ch":["断面積40mm²の丸棒に、1,600Nの引張荷重が働いているときの引張応力は40N/mm²である。","長さ5mの丸棒を引っ張ったときの縦ひずみが0.1％の場合、伸びは5mmである。","両端支持ばりで、中央に500Nの集中荷重が作用して、釣り合っているときの2つの支点の反力はそれぞれ250Nである。","機械構造用炭素鋼鋼材の基準強さが570MPaのとき、許容応力を190MPaとすると、安全率は5となる。"]},{"y":2024,"n":48,"t":"mc","cat":"材料力学","q":"下図において、継手にかかる荷重Pが6,280N、継手を繋ぐピンに発生するせん断応力が10N/mm²のとき、ピンの直径dとしてもっとも近いものはどれか。","a":"イ","e":"二面せん断なので必要断面積A＝6,280÷(2×10)＝314mm²。πd²/4＝314よりd＝20mm。","ch":["10mm","20mm","30mm","40mm"],"fig":"2024_q48"},{"y":2024,"n":49,"t":"mc","cat":"製図","q":"平歯車およびはすば歯車を外形図で描く場合、歯底円を表す線の種類として、適切なものはどれか。ただし、軸に直角な方向から見た断面を図示する場合は除くものとする。","a":"エ","e":"歯車の略画法では、歯先円は太い実線、基準円（ピッチ円）は細い一点鎖線、歯底円は細い実線で描く（軸に直角方向から見た断面では歯底線は太い実線）。","ch":["太い実線","細い線、または太い破線","細い二点鎖線","細い実線"]},{"y":2024,"n":50,"t":"mc","cat":"製図","q":"JISにおいて、表面性状の図示記号の構成として、適切なものはどれか。","a":"ウ","e":"表面性状の図示記号は、対象面を表す線に対し60°に開いた長短2本の直線で構成し、要求事項を指示するときは長い方の脚に横線を付ける。表面性状パラメータ（Ra 25）は、その横線のすぐ下の位置“a”に記入する。横線の上側は位置“c”＝加工方法。アは値を横線の上側に、イ・エは面を表す線の近くに記入しており誤り。","ch":["ア（図参照）","イ（図参照）","ウ（図参照）","エ（図参照）"],"fig":"2024_q50"},{"y":2025,"n":1,"t":"ox","cat":"工作機械・FA","q":"直立ボール盤における振りとは、取り付けることができる工作物の最小直径のことである。","a":"×","e":"「振り」は取り付けられる工作物の最大直径。主軸中心からコラムまでの距離の2倍で表す。"},{"y":2025,"n":2,"t":"ox","cat":"工作機械・FA","q":"FAにおけるオートローダとは、加工、組立などに供する部品を整列して所定の場所まで自動的に送り出す装置である。","a":"×","e":"この説明はパーツフィーダ。オートローダは工作機械などに工作物を自動的に取付け・取外しする装置。"},{"y":2025,"n":3,"t":"ox","cat":"電気・電子","q":"下図に示す回路に流れる電流Iは、0.5Aである。","a":"○","e":"50Ωの並列は25Ω、＋5Ωで30Ω。20Ωとの並列は30×20/50＝12Ω。I＝6÷12＝0.5A。","fig":"2025_q3"},{"y":2025,"n":4,"t":"ox","cat":"電気・電子","q":"三相誘導電動機の極数が4極、電源周波数が50Hz、すべり2％の場合の回転数は、1,470min⁻¹である。","a":"○","e":"同期速度＝120×50/4＝1,500min⁻¹。1,500×0.98＝1,470min⁻¹。"},{"y":2025,"n":5,"t":"ox","cat":"電気・電子","q":"下図に示す回路は、自己保持回路を形成している。","a":"○","e":"停止用BS1（b接点）と始動用BS2（a接点）が直列にあり、BS2と並列に電磁接触器MCのa接点が入っている。BS2を押すとMCが励磁され、そのa接点が閉じて回路を保持するため自己保持回路になる。","fig":"2025_q5"},{"y":2025,"n":6,"t":"ox","cat":"保全管理","q":"ある設備において、基準サイクルタイムが1分30秒、実際サイクルタイムが3分、加工数量が18,000個、不良数量が100個、負荷時間が2,000時間、停止時間が200時間であった。このときの時間稼働率は、80％である。","a":"×","e":"時間稼働率＝（負荷時間−停止時間）÷負荷時間＝(2,000−200)÷2,000＝0.9＝90％。サイクルタイムや加工数量は性能稼働率・良品率の計算に使う。"},{"y":2025,"n":7,"t":"ox","cat":"保全管理","q":"ある設備において、設備の稼働時間の合計が240時間、故障停止回数が6回、故障の修復にかかった時間の合計が60時間であった。このときのMTBFは40時間である。","a":"○","e":"MTBF＝稼働時間÷故障回数＝240÷6＝40時間。MTTRは60÷6＝10時間。"},{"y":2025,"n":8,"t":"ox","cat":"保全管理","q":"TPMは、生産システム効率化の極限追求（総合的効率化）をする企業の体質づくりを目標にしている。","a":"○","e":"TPMの定義どおり。"},{"y":2025,"n":9,"t":"ox","cat":"保全管理","q":"故障の解析手法の1つであるFMEAは、トップダウン方式で進めていく。","a":"×","e":"FMEAはボトムアップ手法。トップダウンで展開するのはFTA。"},{"y":2025,"n":10,"t":"ox","cat":"保全管理","q":"減価償却費は、設備性能劣化に起因する生産減損失や、設備修理期間中の休止損失などの費用の総称である。","a":"×","e":"この説明は機会損失費。減価償却費は設備の取得費用を耐用年数にわたり費用配分したもの。"},{"y":2025,"n":11,"t":"ox","cat":"保全管理","q":"寿命特性曲線における摩耗故障期では、故障率が安定するため予防保全の効果が低い。","a":"×","e":"摩耗故障期は劣化により故障率が上昇していく期間で、部品交換など予防保全の効果が高い。故障率が安定するのは偶発故障期。"},{"y":2025,"n":12,"t":"ox","cat":"保全管理","q":"予知保全の例として、搬送設備の定期的な整備が挙げられる。","a":"×","e":"定期的な整備は時間基準保全（TBM）。予知保全は振動や温度などの状態量を測定し、劣化の兆候から交換時期を判断する状態基準保全（CBM）。"},{"y":2025,"n":13,"t":"ox","cat":"油圧・空気圧","q":"ポンプに発生したキャビテーション対策の1つとして、吸込揚程を小さくすることが挙げられる。","a":"○","e":"吸込揚程を小さくすると吸込側圧力の低下が抑えられ、キャビテーションを防げる。"},{"y":2025,"n":14,"t":"ox","cat":"品質管理","q":"下図は、新QC七つ道具のうち、連関図法の概念図である。","a":"○","e":"連関図法は、原因と結果が複雑に絡み合う問題について、要因を矢印で結んで relationships を整理する手法。図はその概念図。","fig":"2025_q14"},{"y":2025,"n":15,"t":"ox","cat":"品質管理","q":"問題解決型のQCストーリーでは、「効果の確認」の次に「標準化と管理の定着」を行う。","a":"○","e":"QCストーリーはテーマ選定→現状把握→目標設定→要因解析→対策立案・実施→効果の確認→標準化と管理の定着→反省と今後の対応の順に進める。"},{"y":2025,"n":16,"t":"ox","cat":"品質管理","q":"ある製品の重量を測定した結果、7g、9g、10g、11g、13gの5個のデータが得られた。これらの製品の標準偏差は3gである。","a":"×","e":"平均10g、偏差−3,−1,0,+1,+3、二乗和20。20÷5＝4より標準偏差は2g。"},{"y":2025,"n":17,"t":"ox","cat":"品質管理","q":"np管理図を用いる例として、毎日生産量が違う工程における不良品数の管理が挙げられる。","a":"×","e":"np管理図は群の大きさが一定のときに用いる。生産量が変わる場合は不良率を扱うp管理図。"},{"y":2025,"n":18,"t":"ox","cat":"機械材料","q":"フェライト系ステンレス鋼は、高温でもフェライトのままで変態しない。","a":"○","e":"フェライト系（SUS430など）は加熱してもオーステナイトへ変態しないため、焼入れによる硬化ができない。磁性がある。"},{"y":2025,"n":19,"t":"ox","cat":"機械材料","q":"SS400は、FC200と比べ、引張強さが小さい。","a":"×","e":"SS400の400は最低引張強さ400N/mm²、FC200の200は引張強さ200N/mm²を表す。SS400の方が引張強さは大きい。"},{"y":2025,"n":20,"t":"ox","cat":"機械材料","q":"焼ならしは、完全焼なましと比べ、冷却速度が速い。","a":"○","e":"焼ならしは加熱後に空冷（放冷）、完全焼なましは炉冷でゆっくり冷やす。焼ならしの方が冷却速度が速く、組織が微細になる。"},{"y":2025,"n":21,"t":"ox","cat":"安全衛生","q":"労働災害に関する指標の中で、年千人率は、下記の式で求められる。\n（延べ労働損失日数÷延べ実労働時間数）×1,000","a":"×","e":"この式は強度率。年千人率＝1年間の死傷者数÷1年間の平均労働者数×1,000。"},{"y":2025,"n":22,"t":"ox","cat":"安全衛生","q":"KYT（危険予知訓練）の4ラウンド法において、2ラウンド目に行うのは、本質追究である。","a":"○","e":"1R現状把握 → 2R本質追究 → 3R対策樹立 → 4R目標設定。"},{"y":2025,"n":23,"t":"ox","cat":"安全衛生","q":"B火災を消火する方法の1つとして、水（浸潤剤等入）消火器で棒状放射することが挙げられる。","a":"×","e":"B火災は油火災。水を棒状放射すると油が飛散して火災が拡大し危険。B火災には粉末・泡・二酸化炭素消火器などを用いる。"},{"y":2025,"n":24,"t":"ox","cat":"安全衛生","q":"SDS（安全データシート）には、化学物質が人体に及ぼす作用や、貯蔵または取扱い上の注意などが記載されている。","a":"○","e":"SDSには化学物質の危険有害性、人体への影響、貯蔵・取扱い上の注意、応急措置などが記載される。"},{"y":2025,"n":25,"t":"ox","cat":"安全衛生","q":"労働安全衛生規則において、特別教育の記録の保存が義務付けられているのは7年間である。","a":"×","e":"特別教育の記録（受講者・科目等）の保存期間は3年間。"},{"y":2025,"n":26,"t":"mc","cat":"機械要素","q":"機械要素に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"呼び径が同じなら、並目ねじのピッチは細目ねじより大きい。細目は同じ呼び径でピッチを細かくしたもの。","ch":["ボールねじは、予圧を与えることにより、バックラッシを低減し、剛性を高めることができる。","メートル台形ねじは、三角ねじよりも摩擦力が小さい。","呼び径が同じ場合、並目ねじは、細目ねじよりもピッチが小さい。","メカニカルシールは、グランドパッキンと比べ、摺動面の摩擦抵抗が小さい。"]},{"y":2025,"n":27,"t":"mc","cat":"機械要素","q":"機械要素に関する記述のうち、適切でないものはどれか。","a":"イ","e":"ブレーキトルク＝摩擦力×ドラム半径なので、直径が大きいほどブレーキトルクは大きくなる。","ch":["オルダム軸継手は、大きな動力伝達や高速回転に適していない。","ブレーキドラムの直径が大きいほど、ブレーキトルクは小さくなる。","タイミングベルトは、平ベルトと比べ、初期張力が少なくてすむ。","電磁クラッチは、機械クラッチに比べ、連結時間が短い。"]},{"y":2025,"n":28,"t":"mc","cat":"機械要素","q":"1組の平歯車において、モジュール5mm、中心距離225mm、速度伝達比2の場合、それぞれの歯車の歯数の組合せとして、適切なものはどれか。","a":"イ","e":"z₁+z₂＝2×225÷5＝90。速度伝達比2よりz₂＝2z₁、3z₁＝90、z₁＝30、z₂＝60。","ch":["15と30","30と60","15と45","20と40"]},{"y":2025,"n":29,"t":"mc","cat":"測定機器","q":"測定器に関する記述のうち、適切でないものはどれか。","a":"エ","e":"ダイヤルゲージの長針は、プランジャを押し込むと右回り（時計回り）に動く。","ch":["電磁流量計は、測定する流体の圧力や粘度の影響を受けない。","ニッケルを用いた抵抗温度計は、白金温度計よりも測定温度範囲が狭い。","差圧式流量計は、水や油だけでなく、ガスや蒸気の流量も測定できる。","ダイヤルゲージの長針は、プランジャ（スピンドル）を押し込むときに反時計回りに動く。"]},{"y":2025,"n":30,"t":"mc","cat":"振動・破面解析","q":"振動および振動計に関する記述のうち、適切なものはどれか。","a":"エ","e":"アンバランスは回転周波数（1,200÷60＝20Hz）で現れる低〜中周波の振動なので速度モードが有効。ア：高周波は圧電型加速度センサ。イ：触針式は高域の特性が悪い。ウ：1,200min⁻¹は20Hz。","ch":["動電型速度センサは、圧電型加速度センサと比較して、高い周波数まで測定可能である。","手持ちの触針式のセンサは、マグネット式と比較して、高域帯の周波数特性に有効である。","1,200min⁻¹で回転している軸の回転周波数は、1,200Hzである。","1,200min⁻¹で回転する送風機のアンバランスを振動測定で検知するには、速度測定モードが有効である。"]},{"y":2025,"n":31,"t":"mc","cat":"振動・破面解析","q":"破面解析に関する記述のうち、適切でないものはどれか。","a":"ア","e":"疲労破壊は弾性限度以下の応力でも、繰返し数が多ければ発生する。","ch":["疲労破壊は、作用する繰返し応力が弾性限度以下では発生しない。","ディンプル模様の破面は、延性破壊が推定される。","ストライエーションは、繰り返し荷重の1サイクルごとに形成される縞模様のことをいう。","フラクトグラフィとは、破断面の破壊の状態を観察・解析することをいう。"]},{"y":2025,"n":32,"t":"mc","cat":"振動・破面解析","q":"オイルホイップに関する記述のうち、適切でないものはどれか。","a":"ア","e":"オイルホイップは油膜による自励振動。アンバランスなど外力によって起こる強制振動ではない。","ch":["強制振動の一種である。","発生する周波数は、回転軸の一次危険速度の周波数と一致する。","振回りの方向は、軸の回転方向と同じである。","軸の回転数が、回転軸の一次危険速度の2倍以上となったときに発生する。"]},{"y":2025,"n":33,"t":"mc","cat":"潤滑","q":"潤滑油の試験項目に関する記述のうち、適切でないものはどれか。","a":"エ","e":"酸価は、試料1g中の酸性成分を中和するのに要する水酸化カリウム（KOH）のmg数。潤滑油の劣化（酸化）の指標になる。","ch":["動粘度は、粘度をその液体の同一状態（温度、圧力）における密度で除した商である。","引火点は、規定条件下で引火源を試料蒸気に近づけたとき、試料蒸気が閃光を発して瞬間的に燃焼し、かつその炎が液面上を伝播する試料の最低温度を101.3kPaの値に気圧補正した温度のことである。","流動点は、試料を45℃に加熱した後、試料をかき混ぜないで規定の方法で冷却したとき、試料が流動する最低温度である。","酸価は、試料1g中に含まれる塩基性成分を中和するのに要する塩酸のmg数である。"]},{"y":2025,"n":34,"t":"mc","cat":"潤滑","q":"潤滑に関する記述のうち、適切なものはどれか。","a":"エ","e":"シリコングリースは耐熱性・耐寒性に優れるが、耐圧（耐荷重）性が低く高荷重部には向かない。ア：リチウムグリースは耐水性・耐熱性に優れる汎用グリース。イ：ナトリウムグリースは耐水性が悪い。ウ：グラファイトは固体潤滑剤で耐摩耗性に優れる。","ch":["リチウムグリースは、耐水性、耐圧性が低い。","ナトリウムグリースは、耐水性がよいが、極圧性、潤滑性が低い。","グラファイト系グリースは、耐摩耗性が低い。","シリコングリースは、耐熱性は良いが、耐圧性が低い。"]},{"y":2025,"n":35,"t":"mc","cat":"潤滑","q":"潤滑油の汚染度分析に用いられるSOAP法に関する記述のうち、適切なものはどれか。","a":"イ","e":"SOAP法は油中の摩耗粉を分光分析し、金属元素とその濃度から損傷箇所を推定する方法。ア：定量フェログラフィ法。ウ：分析フェログラフィ法。エ：メンブレンフィルタ法。","ch":["総摩耗粒子量と異常摩耗粒子量の値を傾向管理する。","潤滑油中の摩耗粉を分光分析し、金属元素成分とその濃度を測定する。","フェロスコープで摩耗粒子の大きさや形状、色などを観察する。","潤滑油100mlを濾過し、乾燥後コンタミナントを顕微鏡で観察する。"]},{"y":2025,"n":36,"t":"mc","cat":"機械工作法","q":"機械工作法に関する記述のうち、適切なものはどれか。","a":"ア","e":"電解研磨は1個ずつ通電（電極接続）する必要があるため、小物の大量処理には向かない。化学薬品に浸すだけの化学研磨は大量処理が容易。イ：鏡面に仕上がるのは乾式。ウ：通電するのは電解研磨。エ：加工速度が速いのはレーザ加工。","ch":["電解研磨は、化学研磨に比べ、小物を大量に処理することが困難である。","湿式ラッピングは、乾式ラッピングに比べ、表面が光沢のある鏡面に仕上がる。","化学研磨は、金属を化学薬品中に浸し、通電することで金属の表面を磨くものである。","ワイヤ放電加工は、レーザ加工に比べ、加工速度が速い。"]},{"y":2025,"n":37,"t":"mc","cat":"機械工作法","q":"機械工作法に関する記述のうち、適切なものはどれか。","a":"ウ","e":"低圧鋳造法は、るつぼ内に低圧の空気を加えて溶湯を下から押し上げ、金型に静かに充填する方法。ア：それは再結晶温度。イ：細かな造形にはインベストメント（ロストワックス）鋳造法が適する。エ：圧造ののちに転造する。","ch":["変形を加えた金属を加熱した時に、再結晶が起こる温度を鍛造温度という。","細かな造形が必要な製品を作る場合、インベストメント鋳造法より、ダイカスト法が適している。","低圧鋳造法では、溶湯を重力と逆方向に押し上げて金型に流し込む。","ねじは、線材を転造したのちに、圧造してつくられる。"]},{"y":2025,"n":38,"t":"mc","cat":"溶接・非破壊検査","q":"溶接に関する記述のうち、適切でないものはどれか。","a":"エ","e":"金属が蒸気となったものは溶接ヒューム。スラグはフラックスが溶けて溶接ビード表面を覆う非金属物質で、急冷を防ぎ酸化を防止する。","ch":["オーバラップは、溶接部で溶接金属が母材に融合せずに、重なってしまう欠陥である。","アンダカットは、溶接の止端に沿って母材が掘られ、溶着金属が満たされず溝となり残る欠陥である。","スパッタは、溶接中に飛散する金属粒などのことである。","スラグは、アークの熱によって溶けた金属が蒸気となったものである。"]},{"y":2025,"n":39,"t":"mc","cat":"溶接・非破壊検査","q":"磁粉探傷試験に関する文中の（　）内に当てはまる語句として、適切なものはどれか。\n「（　）とは、試験体または試験体の一部を電磁石の磁極に接して設置し、電磁石によって発生した磁束を試験体の中に投入して磁化する方法である。」","a":"ア","e":"極間法は電磁石（ヨーク）の磁極を試験体に当てて磁化する方法。コイル法はコイル内に置き、プロッド法は電極を当てて電流を流し、電流貫通法は貫通導体に電流を流して磁化する。","ch":["極間法","コイル法","プロッド法","電流貫通法"]},{"y":2025,"n":40,"t":"mc","cat":"油圧・空気圧","q":"油圧・空気圧回路に関する記述のうち、適切でないものはどれか。","a":"ア","e":"設定圧力以上で油を逃がすのはリリーフ弁。カウンタバランス弁は戻り側に背圧を与えて自重落下を防止する弁。","ch":["カウンタバランス弁は、回路内の圧力が設定圧力以上になると自動的に油圧を逃がす。","インタフローとは、バルブの切替途中で過渡的に生じるバルブポートの流れである。","デコンプレッションとは、プレスなどで油圧シリンダの圧力を静かに抜き、機械の損傷となる回路の衝撃を少なくすることである。","カットオフとは、ポンプ出口側圧力が設定圧力に近づいたとき、可変吐出し量制御が働いて、流量を減少させることである。"]},{"y":2025,"n":41,"t":"mc","cat":"油圧・空気圧","q":"直流ソレノイドに関する文中の（　）内の数字に当てはまる語句の組合せとして、適切なものはどれか。\n「直流ソレノイドは、温度が（　①　）と吸引力が低下する。また、交流ソレノイドよりも、切換速度が（　②　）。」","a":"イ","e":"温度が上がるとコイル抵抗が増えて電流が減り、吸引力が低下する。また直流ソレノイドは突入電流がなく、交流に比べて切換（応答）速度は遅い。","ch":["①上がる　②速い","①上がる　②遅い","①下がる　②速い","①下がる　②遅い"]},{"y":2025,"n":42,"t":"mc","cat":"油圧・空気圧","q":"油圧・空気圧機器の異常に関する記述のうち、適切でないものはどれか。","a":"ア","e":"ゴムホースは温度や圧力による伸縮・振動を吸収できるよう、適度なたるみをもたせて取り付ける。張って取り付けると破損しやすい。","ch":["油圧装置において直線的に使用していたゴムホースが破損したため、新しいゴムホースをたるみがないよう張って取り付けた。","油圧ポンプから異常音がしたため、作動油の粘度を下げた。","ルブリケータ内の潤滑油が少なかったので、タービン油を足した。","油圧シリンダの速度が低下したため、油圧ポンプの容積効率を向上させた。"]},{"y":2025,"n":43,"t":"mc","cat":"油圧・空気圧","q":"作動油に加えられた添加剤に関する記述のうち、適切なものはどれか。","a":"ア","e":"油性向上剤（油性剤）は金属面に吸着して境界潤滑膜をつくり、低荷重域の摩擦・摩耗を減らす。イ：腐食防止（防錆）剤の説明で、極圧添加剤は高荷重下の焼付きを防ぐ。ウ・エ：清浄剤は高温、分散剤は低温での作用であり説明が逆。","ch":["油性向上剤は、低荷重下において摩擦面に油膜を形成し、摩擦および摩耗を減少させる効果がある。","極圧添加剤は、金属面が化学的に腐食されることを防止する効果がある。","分散剤は、高温運転における劣化生成物の沈積を防止する効果がある。","清浄剤は、低温運転におけるスラッジの生成を防止する効果がある。"]},{"y":2025,"n":44,"t":"mc","cat":"機械材料","q":"非金属材料に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"アクリル樹脂は熱可塑性樹脂。無色透明で光透過率が高いという点は正しいが、熱硬化性という部分が誤り。","ch":["結晶性合成樹脂は、非結晶性合成樹脂と比べ、成形収縮率が大きい。","ポリプロピレン樹脂は、ABS樹脂に比べ、耐薬品性に優れる。","アクリル樹脂は、熱硬化性であり、完全に無色透明で、光の透過率は100％に近い。","メラミン樹脂は、フェノール樹脂と比べ、耐アーク性に優れる。"]},{"y":2025,"n":45,"t":"mc","cat":"機械材料","q":"金属の表面処理に関する記述のうち、適切でないものはどれか。","a":"ウ","e":"クロメート処理の耐食性は、光沢（ユニクロ）＜有色（クロメート）＜黒色の順に高い。光沢クロメートは外観重視で耐食性は劣る。","ch":["SPCCやS15Cに浸炭窒化処理を行うと、硬度が上がる。","浸炭は、主に低炭素の鋼に使用される。","光沢クロメートは、有色クロメートより耐食性に優れる。","電着塗装には、エポキシ樹脂系の水性塗料が用いられ、防食効果が大きい。"]},{"y":2025,"n":46,"t":"mc","cat":"材料力学","q":"下図に示す滑車の仕掛けで、物体に働く力Wが800Nのとき、ロープを引く力Fとして適切なものはどれか。","a":"イ","e":"動滑車を2個組み合わせているため、荷を支えるロープは4本になり引く力は1/4。800÷4＝200N。","ch":["100N","200N","400N","800N"],"fig":"2025_q46"},{"y":2025,"n":47,"t":"mc","cat":"材料力学","q":"材料力学に関する記述のうち、適切でないものはどれか。","a":"イ","e":"荷重500Nを2つの支点で等しく分担するので、反力はそれぞれ250N。ア：500÷150≒3.33で3より大きい。ウ：1,600÷40＝40N/mm²。エ：5,000×0.001＝5mm。","ch":["機械構造用炭素鋼鋼材の基準強さが500MPaのとき、許容応力を150MPaとすると、安全率は3より大きい。","両端支持ばりで、中央に500Nの集中荷重が作用して、釣り合っているときの2つの支点の反力はそれぞれ500Nである。","断面積40mm²の丸棒に、1,600Nの引張荷重が働いているときの引張応力は40N/mm²である。","長さ5mの丸棒を引っ張ったときの縦ひずみが0.1％の場合、伸びは5mmである。"]},{"y":2025,"n":48,"t":"mc","cat":"材料力学","q":"下図において、継手にかかる荷重Pが6,280N、継手を繋ぐピンに発生するせん断応力が10N/mm²のとき、ピンの直径dとしてもっとも近いものはどれか。","a":"イ","e":"二面せん断なので必要断面積A＝6,280÷(2×10)＝314mm²。πd²/4＝314よりd＝20mm。","ch":["10mm","20mm","30mm","40mm"],"fig":"2025_q48"},{"y":2025,"n":49,"t":"mc","cat":"製図","q":"平歯車およびはすば歯車を外形図で描く場合、軸に直角な方向から見た図を断面で図示するときを除き、歯底円を表す線の種類として、適切なものはどれか。","a":"エ","e":"歯車の略画法では歯先円は太い実線、基準円（ピッチ円）は細い一点鎖線、歯底円は細い実線で描く。","ch":["太い実線","細い線、または太い破線","細い二点鎖線","細い実線"]},{"y":2025,"n":50,"t":"mc","cat":"製図","q":"JISにおいて、表面性状の図示記号の構成として、適切なものはどれか。","a":"ア","e":"表面性状パラメータ（Ra 25）は、長い方の脚に付けた横線のすぐ下の位置“a”に記入する。また削り代（この図の「3」）は位置“e”＝記号の左側に記入する。ウ・エは値を横線の上側に、イは削り代を記号の右側に記入しており誤り。","ch":["ア（図参照）","イ（図参照）","ウ（図参照）","エ（図参照）"],"fig":"2025_q50"}];
