const NOTES = {"2024": "問40は問題不成立のため削除され、すべての解答が正答として採点された。本アプリでは出題対象から除いている（全49問）。"};
const YEARS = [2020,2021,2022,2023,2024,2025];
const CATS = [...new Set(DATA.map(q=>q.cat))];

/* ---------- 記録（利用できる環境では保存、不可ならセッション内のみ） ---------- */
const SKEY = 'kikaihozen1-stats-v1';
const mem = {};
let storageOK = true;
const Store = {
  load(){
    try{ const v = localStorage.getItem(SKEY); if(v) return JSON.parse(v); }
    catch(e){ storageOK = false; }
    return mem.stats || {};
  },
  save(o){
    mem.stats = o;
    try{ localStorage.setItem(SKEY, JSON.stringify(o)); }
    catch(e){ storageOK = false; }
  }
};
let stats = {};
const sid = q => q.y + '-' + q.n;
function record(q, ok){
  const k = sid(q), s = stats[k] || {c:0,w:0,last:null};
  ok ? s.c++ : s.w++; s.last = ok ? 1 : 0;
  stats[k] = s; Store.save(stats);
}
const isWeak = q => { const s = stats[sid(q)]; return !!s && s.last === 0; };

/* ---------- 状態 ---------- */
let S = {
  view:'home', mode:'drill',
  years:[2025], type:'all', cats:[], order:'seq', limit:0,
  list:[], i:0, ans:{}, shown:{}, src:null
};
const $ = s => document.querySelector(s);
const fmt = n => (Math.round(n*10)/10).toString();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pool(){
  let a = DATA.filter(q => S.years.includes(q.y));
  if(S.type !== 'all') a = a.filter(q => q.t === S.type);
  if(S.cats.length) a = a.filter(q => S.cats.includes(q.cat));
  return a;
}
function build(){
  let a = pool().slice();
  if(S.order === 'rand'){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} }
  else a.sort((x,y)=> x.y-y.y || x.n-y.n);
  if(S.limit) a = a.slice(0, S.limit);
  return a;
}

/* ---------- 画面 ---------- */
function render(){
  if(S.view==='home') home();
  else if(S.view==='quiz') quiz();
  else result();
  window.scrollTo(0,0);
}

function home(){
  $('#ttl').textContent = '機械保全技能士1級 学科';
  $('#pos').textContent = ''; $('#quit').hidden = true; $('#prog').style.width='0';
  $('#foot').hidden = true;
  const n = pool().length;
  const weak = DATA.filter(isWeak).length;
  const done = DATA.filter(q=>stats[sid(q)]).length;
  const cor = DATA.reduce((t,q)=>{const s=stats[sid(q)];return t+(s?s.c:0);},0);
  const wrg = DATA.reduce((t,q)=>{const s=stats[sid(q)];return t+(s?s.w:0);},0);
  const notes = S.years.map(y=>NOTES[y]).filter(Boolean);

  $('#app').innerHTML = `
  <h2>出題範囲</h2>
  <div class="card">
    <div class="hint" style="margin-bottom:8px">年度（複数選べます）</div>
    <div class="chips" id="cy">
      ${YEARS.map(y=>`<button class="chip" data-y="${y}" aria-pressed="${S.years.includes(y)}">${y}年度</button>`).join('')}

    </div>
    <div class="hint" style="margin:16px 0 8px">形式</div>
    <div class="chips" id="ct">
      ${[['all','すべて'],['ox','○×（問1〜25）'],['mc','四択（問26〜50）']].map(([v,l])=>
        `<button class="chip" data-t="${v}" aria-pressed="${S.type===v}">${l}</button>`).join('')}
    </div>
    <div class="hint" style="margin:16px 0 8px">出題順</div>
    <div class="chips" id="co">
      ${[['seq','番号順'],['rand','ランダム']].map(([v,l])=>
        `<button class="chip" data-o="${v}" aria-pressed="${S.order===v}">${l}</button>`).join('')}
    </div>
    <div class="hint" style="margin:16px 0 8px">問題数</div>
    <div class="chips" id="cl">
      ${[[0,'全部'],[10,'10問'],[25,'25問'],[50,'50問']].map(([v,l])=>
        `<button class="chip" data-l="${v}" aria-pressed="${S.limit===v}">${l}</button>`).join('')}
    </div>
    <details style="margin-top:16px">
      <summary class="hint" style="cursor:pointer">分野をしぼる${S.cats.length?`（${S.cats.length}分野を選択中）`:'（すべて）'}</summary>
      <div class="chips" id="cc" style="margin-top:10px">
        ${CATS.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${S.cats.includes(c)}">${esc(c)}</button>`).join('')}
      </div>

    <div class="count num">対象 ${n}問</div>
    ${notes.map(t=>`<div class="note">${esc(t)}</div>`).join('')}
  </div>

  <h2>モードを選ぶ</h2>

  <button class="btn" id="go-test" ${n?'':'disabled'}>テスト形式ではじめる

    <small>${weak?`直近でまちがえた ${weak}問`:'まちがえた問題がまだありません'}</small></button>

  <div class="card">
    <div class="metrics">
      <div>解いた問題<b class="num">${done} / ${DATA.length}</b></div>
      <div>正答<b class="num">${cor}</b></div>
      <div>誤答<b class="num">${wrg}</b></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="exp" style="font-weight:400;font-size:14px;margin-top:0">記録を書き出す</button>
      <button class="btn" id="imp" style="font-weight:400;font-size:14px;margin-top:0">記録を読み込む</button>
    </div>
    ${done?`<button class="btn" id="reset" style="font-weight:400;font-size:14px">記録を消す</button>`:''}
    <input type="file" id="impf" accept="application/json,.json" hidden>
    ${storageOK?'':'<div class="note">この環境では記録を保存できません。ブラウザの設定（プライベートモード等）を確認するか、書き出し機能でバックアップしてください。</div>'}
  </div>
  <p class="hint" style="margin-top:18px">収録：2020〜2025年度（第2回）機械系保全作業 1級 学科試験 ${DATA.length}問。
  合格ラインは100点満点で65点（正答率65％）です。<br>
  iPhoneは共有ボタン →「ホーム画面に追加」でアプリのように起動でき、以後は圏外でも使えます。</p>`;

  $('#cy').onclick = e => { const b=e.target.closest('[data-y]'); if(!b)return;
    const y=+b.dataset.y; S.years = S.years.includes(y) ? S.years.filter(v=>v!==y) : S.years.concat(y);
    if(!S.years.length) S.years=[y]; home(); };
  $('#ally').onclick = () => { S.years = S.years.length===6 ? [2025] : YEARS.slice(); home(); };
  $('#ct').onclick = e => { const b=e.target.closest('[data-t]'); if(b){S.type=b.dataset.t; home();} };
  $('#co').onclick = e => { const b=e.target.closest('[data-o]'); if(b){S.order=b.dataset.o; home();} };
  $('#cl').onclick = e => { const b=e.target.closest('[data-l]'); if(b){S.limit=+b.dataset.l; home();} };
  $('#cc').onclick = e => { const b=e.target.closest('[data-c]'); if(!b)return;
    const c=b.dataset.c; S.cats = S.cats.includes(c)? S.cats.filter(v=>v!==c) : S.cats.concat(c); home(); };
  $('#go-drill').onclick = () => start('drill', build());
  $('#go-test').onclick  = () => start('test',  build());
  $('#go-weak').onclick  = () => start('drill', DATA.filter(isWeak).sort((a,b)=>a.y-b.y||a.n-b.n));
  const rs = $('#reset'); if(rs) rs.onclick = () => { if(confirm('これまでの正誤の記録を消します。よろしいですか？')){ stats={}; Store.save(stats); home(); } };
  $('#exp').onclick = () => {
    const blob = new Blob([JSON.stringify({app:'kikaihozen1',v:1,saved:new Date().toISOString(),stats},null,1)],{type:'application/json'});
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    const d = new Date(), p = n => String(n).padStart(2,'0');
    a.href = url; a.download = `機械保全1級_記録_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
  };
  $('#imp').onclick = () => $('#impf').click();
  $('#impf').onchange = e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const o = JSON.parse(r.result);
        if(!o || typeof o.stats !== 'object') throw 0;
        if(!confirm('読み込んだ記録で、いまの記録を置き換えます。よろしいですか？')) return;
        stats = o.stats; Store.save(stats); home();
      }catch(err){ alert('このファイルは読み込めませんでした。書き出したJSONファイルを選んでください。'); }
    };
    r.readAsText(f); e.target.value = '';
  };
}

function start(mode, list){
  if(!list.length) return;
  S.mode = mode; S.list = list; S.i = 0; S.ans = {}; S.shown = {}; S.view = 'quiz';
  render();
}

function quiz(){
  const q = S.list[S.i], total = S.list.length, picked = S.ans[S.i];
  const revealed = S.mode==='drill' && S.shown[S.i];
  $('#ttl').textContent = S.mode==='drill' ? '一問一答' : 'テスト形式';
  $('#pos').textContent = `${S.i+1} / ${total}`;
  $('#quit').hidden = false;
  $('#prog').style.width = ((S.i + (revealed||S.mode==='test'&&picked?1:0)) / total * 100) + '%';

  const ox = q.t === 'ox';
  const letters = ['ア','イ','ウ','エ'];
  let body = '';
  if(ox){
    body = `<div class="oxrow ${revealed?'':'pick'}">` + ['○','×'].map(v=>{
      let cl='ox'; if(picked===v) cl+=' sel';
      if(revealed){ if(v===q.a) cl+=' good'; else if(picked===v) cl+=' bad'; }
      return `<button class="${cl}" data-v="${v}" ${revealed?'disabled':''}>${v}
        <span>${v==='○'?'正しい':'誤り'}</span></button>`;
    }).join('') + `</div>`;
  } else {
    body = `<div class="${revealed?'':'pick'}">` + q.ch.map((c,k)=>{
      const v = letters[k]; let cl='opt'; if(picked===v) cl+=' sel';
      if(revealed){ if(v===q.a) cl+=' good'; else if(picked===v) cl+=' bad'; }
      return `<button class="${cl}" data-v="${v}" ${revealed?'disabled':''}><b>${v}</b><span>${esc(c)}</span></button>`;
    }).join('') + `</div>`;
  }

  let judge = '';
  if(revealed){
    const ok = picked === q.a;
    judge = `<div class="judge ${ok?'o':'x'}" role="status">
      <div class="t">${ok?'正解':'不正解'}</div>
      <div class="num" style="font-size:14px">正解は <b>${q.a}</b>${ok?'':`／あなたの解答 <b>${picked}</b>`}</div>
      <div class="exp"><span class="lb">解説</span>${esc(q.e)}</div></div>`;
  }

  $('#app').innerHTML = `
    <div class="qmeta">
      <span class="num">${q.y}年度　問${q.n}</span>
      <span class="qtag">${esc(q.cat)}</span>
    </div>
    ${q.fig?`<div class="fig"><img src="${FIGS[q.fig]}" alt="問${q.n}の図"></div>`:''}
    <div class="qtext">${esc(q.q)}</div>
    ${body}
    ${judge}
    ${S.mode==='test'? `<h2>解答状況</h2><div class="grid" id="grid">${
      S.list.map((_,k)=>`<button class="gi${S.ans[k]?' done':''}${k===S.i?' now':''}" data-k="${k}">${k+1}</button>`).join('')
    }</div>` : ''}`;

  $('#app').onclick = e => {
    const b = e.target.closest('[data-v]');
    if(b){ pickAnswer(b.dataset.v); return; }
    const g = e.target.closest('[data-k]');
    if(g){ S.i = +g.dataset.k; quiz(); }
  };
  foot();
}

function pickAnswer(v){
  const q = S.list[S.i];
  if(S.mode==='drill'){
    if(S.shown[S.i]) return;
    S.ans[S.i] = v; S.shown[S.i] = true; record(q, v===q.a);
  } else {
    S.ans[S.i] = v;
  }
  quiz();
  if(S.mode==='test' && S.i < S.list.length-1){ setTimeout(()=>{ S.i++; quiz(); }, 180); }
}

function foot(){
  const total = S.list.length, last = S.i === total-1;
  const answered = Object.keys(S.ans).length;
  let html = '';
  if(S.mode==='drill'){
    const c = Object.keys(S.shown).filter(k=>S.ans[k]===S.list[k].a).length;
    const w = Object.keys(S.shown).length - c;
    html = `<span class="tally">正解 ${c}／誤り ${w}</span>
      <button class="btn" id="prev" ${S.i?'':'disabled'} style="flex:0 0 82px">戻る</button>
      <button class="btn primary" id="next" ${S.shown[S.i]?'':'disabled'}>${last?'結果を見る':'次の問題'}</button>`;
  } else {
    html = `<span class="tally num">解答済 ${answered}／${total}</span>
      <button class="btn" id="prev" ${S.i?'':'disabled'} style="flex:0 0 74px">戻る</button>
      <button class="btn" id="next" ${last?'disabled':''} style="flex:0 0 74px">次へ</button>
      <button class="btn primary" id="grade">採点する</button>`;
  }
  $('#foot').hidden = false; $('#footin').innerHTML = html;
  const p=$('#prev'); if(p) p.onclick = ()=>{ if(S.i>0){S.i--; quiz();} };
  const n=$('#next'); if(n) n.onclick = ()=>{
    if(S.mode==='drill' && !S.shown[S.i]) return;
    if(S.i < S.list.length-1){ S.i++; quiz(); } else finish();
  };
  const g=$('#grade'); if(g) g.onclick = ()=>{
    const rest = S.list.length - Object.keys(S.ans).length;
    if(rest && !confirm(`未解答が${rest}問あります。採点しますか？`)) return;
    S.list.forEach((q,k)=>{ if(S.ans[k]) record(q, S.ans[k]===q.a); });
    finish();
  };
}

function finish(){ S.view='result'; render(); }

function result(){
  $('#ttl').textContent = '結果'; $('#pos').textContent=''; $('#quit').hidden=true;
  $('#prog').style.width='100%'; $('#foot').hidden = true;
  const total = S.list.length;
  const correct = S.list.filter((q,k)=> S.ans[k]===q.a).length;
  const rate = total? correct/total*100 : 0;
  const pass = rate >= 65;
  const wrongIdx = S.list.map((q,k)=>k).filter(k=> S.ans[k]!==S.list[k].a);

  const byCat = {};
  S.list.forEach((q,k)=>{ const c=byCat[q.cat] || (byCat[q.cat]={c:0,t:0}); c.t++; if(S.ans[k]===q.a) c.c++; });
  const catRows = Object.entries(byCat).sort((a,b)=> a[1].c/a[1].t - b[1].c/b[1].t)
    .map(([nm,v])=>`<div class="catrow"><span class="nm">${esc(nm)}</span>
      <span class="tr"><i style="width:${v.c/v.t*100}%"></i></span>
      <span class="vl num">${v.c}/${v.t}</span></div>`).join('');

  const letters=['ア','イ','ウ','エ'];
  const review = wrongIdx.map(k=>{
    const q = S.list[k], mine = S.ans[k] || '未解答';
    return `<details class="rv"><summary><span class="k num">${q.y}・問${q.n}</span>
      <span>${esc(q.q.slice(0,42))}${q.q.length>42?'…':''}</span></summary>
      <div class="bd">
        ${q.fig?`<div class="fig"><img src="${FIGS[q.fig]}" alt=""></div>`:''}
        <div class="qtext" style="font-size:15.5px">${esc(q.q)}</div>
        ${q.t==='mc'? `<div style="font-size:14.5px;margin-bottom:10px">${q.ch.map((c,i)=>
          `<div style="margin:4px 0"><b>${letters[i]}</b>　${esc(c)}</div>`).join('')}</div>`:''}
        <div class="num" style="font-size:14px">正解 <b>${q.a}</b>　／　あなたの解答 <span class="miss">${mine}</span></div>
        <div class="exp"><span class="lb">解説</span>${esc(q.e)}</div>
      </div></details>`;
  }).join('');

  $('#app').innerHTML = `
    <div class="card score">
      <div><span class="big num">${fmt(rate)}</span><span class="unit">点</span></div>
      <div class="st ${pass?'pass':'fail'}">${pass?'合格ライン（65点）到達':'合格ラインまであと ' + fmt(65-rate) + '点'}</div>
      <div class="metrics">
        <div>正答<b class="num">${correct}</b></div>
        <div>誤答<b class="num">${total-correct}</b></div>
        <div>問題数<b class="num">${total}</b></div>
      </div>
    </div>
    <h2>分野別</h2><div class="card">${catRows}</div>
    ${wrongIdx.length? `<h2>まちがえた問題（${wrongIdx.length}問）</h2>${review}`
      : `<h2>まちがえた問題</h2><div class="card">全問正解です。</div>`}
    <div style="margin-top:22px">
      ${wrongIdx.length?`<button class="btn primary" id="again">まちがえた${wrongIdx.length}問をやり直す</button>`:''}
      <button class="btn" id="same">同じ範囲でもう一度</button>
      <button class="btn" id="home">出題範囲を選びなおす</button>
    </div>`;

  const a=$('#again'); if(a) a.onclick = ()=> start('drill', wrongIdx.map(k=>S.list[k]));
  $('#same').onclick = ()=> start(S.mode, S.order==='rand'? build() : S.list.slice());
  $('#home').onclick = ()=>{ S.view='home'; render(); };
}

$('#quit').onclick = ()=>{
  if(Object.keys(S.ans).length && !confirm('中断してホームに戻りますか？')) return;
  S.view='home'; render();
};

stats = Store.load();
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
